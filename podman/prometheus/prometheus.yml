# Alloy pushes application and agent metrics over remote_write
# (podman/alloy/config.alloy), so this file no longer scrapes the retired
# `otel-collector:8889` endpoint. Prometheus is a write target here, not a
# puller; see adr/traces-and-metrics-routing-via-alloy.md.
#
# Retention and the remote_write receiver are command-line flags, set on the
# `prometheus` service in compose.yaml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus' own metrics. Everything else arrives via remote_write.
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
