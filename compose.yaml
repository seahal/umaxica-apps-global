---
name: umaxica-apps-global
services:
  core:
    build:
      context: "."
      dockerfile: "./Containerfile"
      target: development
      args:
        COMMIT_HASH: abcdef
        # DOCKER_UID/DOCKER_GID are host-shaped; they are supplied by the
        # devcontainer override (.devcontainer/compose.override.yml).
    entrypoint:
      - "/usr/local/bin/core-entrypoint"
    # The container stays up idle; start the Rails/Vite/jobs stack manually
    # with `bin/dev` inside the container when it is wanted.
    command:
      - sleep
      - infinity
    environment:
      # --- Ruby / Bundler ---
      RUBY_PATH: /usr/local/bin/ruby
      BUNDLE_PATH: vendor/bundle
      # --- Rails server ---
      BRAND_NAME: UMAXICA
      PORT: "3000"
      BINDING: "0.0.0.0"
      OPEN_TELEMETRY: "false"
      NODE_ENV: development
      # --- PostgreSQL credentials (injected from host .env with local defaults) ---
      POSTGRESQL_USER: "${POSTGRESQL_USER:-root}"
      POSTGRESQL_PASSWORD_FILE: /run/secrets/dev_postgres_writer
      POSTGRESQL_DATABASE: "${POSTGRESQL_DATABASE:-db}"
      # --- Identifier HMAC salts (dev-only fixed values; differ from production) ---
      EMAIL_ADDRESS_HMAC_SALT: "${EMAIL_ADDRESS_HMAC_SALT:-development_email_address_hmac_salt}"
      TELEPHONE_NUMBER_HMAC_SALT: "${TELEPHONE_NUMBER_HMAC_SALT:-development_telephone_number_hmac_salt}"
      # --- Unified Enforcement identifier HMAC keys (adr/unified-enforcement.md,
      #     D6) -- dedicated per-realm keys, deliberately distinct from the
      #     credential-lookup salts above; dev-only fixed values, differ from
      #     production. ---
      ENFORCEMENT_APP_IDENTIFIER_HMAC_KEY: "${ENFORCEMENT_APP_IDENTIFIER_HMAC_KEY:-development_enforcement_app_identifier_hmac_key}"
      ENFORCEMENT_COM_IDENTIFIER_HMAC_KEY: "${ENFORCEMENT_COM_IDENTIFIER_HMAC_KEY:-development_enforcement_com_identifier_hmac_key}"
      ENFORCEMENT_ORG_IDENTIFIER_HMAC_KEY: "${ENFORCEMENT_ORG_IDENTIFIER_HMAC_KEY:-development_enforcement_org_identifier_hmac_key}"
      # --- PostgreSQL topology ---
      # One `_PUB` (writer) and one `_SUB` (reader) entry per development
      # database in config/database.yml, which reads them with one-argument
      # ENV.fetch: a name missing here fails the boot instead of silently
      # routing that database at the default host. `platform` has no replica
      # entry, so it is writer-only. Keep this list in step with the
      # `development:` block of config/database.yml.
      POSTGRESQL_HOST: primary
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_APP_ZENITH_PUB: primary
      POSTGRESQL_APP_ZENITH_SUB: replica
      POSTGRESQL_ORG_ZENITH_PUB: primary
      POSTGRESQL_ORG_ZENITH_SUB: replica
      POSTGRESQL_COM_ZENITH_PUB: primary
      POSTGRESQL_COM_ZENITH_SUB: replica
      POSTGRESQL_APP_SETTING_PUB: primary
      POSTGRESQL_APP_SETTING_SUB: replica
      POSTGRESQL_ORG_SETTING_PUB: primary
      POSTGRESQL_ORG_SETTING_SUB: replica
      POSTGRESQL_COM_SETTING_PUB: primary
      POSTGRESQL_COM_SETTING_SUB: replica
      POSTGRESQL_APP_TICKET_PUB: primary
      POSTGRESQL_APP_TICKET_SUB: replica
      POSTGRESQL_ORG_TICKET_PUB: primary
      POSTGRESQL_ORG_TICKET_SUB: replica
      POSTGRESQL_COM_TICKET_PUB: primary
      POSTGRESQL_COM_TICKET_SUB: replica
      POSTGRESQL_APP_SIGNAL_PUB: primary
      POSTGRESQL_APP_SIGNAL_SUB: replica
      POSTGRESQL_ORG_SIGNAL_PUB: primary
      POSTGRESQL_ORG_SIGNAL_SUB: replica
      POSTGRESQL_COM_SIGNAL_PUB: primary
      POSTGRESQL_COM_SIGNAL_SUB: replica
      POSTGRESQL_AVATAR_PUB: primary
      POSTGRESQL_AVATAR_SUB: replica
      POSTGRESQL_CACHE_PUB: primary
      POSTGRESQL_CACHE_SUB: replica
      POSTGRESQL_CHRONICLE_PUB: primary
      POSTGRESQL_CHRONICLE_SUB: replica
      POSTGRESQL_OCCURRENCE_PUB: primary
      POSTGRESQL_OCCURRENCE_SUB: replica
      POSTGRESQL_PUBLISHING_PUB: primary
      POSTGRESQL_PUBLISHING_SUB: replica
      POSTGRESQL_QUEUE_PUB: primary
      POSTGRESQL_QUEUE_SUB: replica
      POSTGRESQL_SEARCH_PUB: primary
      POSTGRESQL_SEARCH_SUB: replica
      POSTGRESQL_STORAGE_PUB: primary
      POSTGRESQL_STORAGE_SUB: replica
      POSTGRESQL_PLATFORM_PUB: primary
      # --- Redis / Valkey ---
      VALKEY_URL: "redis://valkey:6379/0"
      RATE_LIMIT_REDIS_URL: "redis://valkey:6379/1"
      # Credentials for the Flipper UI mounted on the developer surface. The mount
      # is wrapped in Rack::Auth::Basic (config/routes/base.rb) and fails closed
      # when these are unset, so local development needs them to reach the UI.
      # Development values only: production supplies them through credentials.
      FLIPPER_UI_USER: "${FLIPPER_UI_USER:-flipper}"
      FLIPPER_UI_PASSWORD: "${FLIPPER_UI_PASSWORD:-development_flipper_password}"
      REDIS_NORMAL_URL: "redis://valkey:6379/7"
      # --- Observability ---
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      # --- Mail ---
      AWS_SES_REGION: ap-northeast-1
      # --- Local object storage (optional profile) ---
      # Credentials are read from the mounted Podman secrets below, matching the
      # PostgreSQL `*_PASSWORD_FILE` convention. They are mounted unconditionally
      # even though RustFS itself is profile-gated, so enabling the profile does
      # not additionally require recreating this container.
      OBJECT_STORAGE_ENDPOINT: "http://rustfs:9000"
      OBJECT_STORAGE_REGION: "us-east-1"
      OBJECT_STORAGE_BUCKET: "${OBJECT_STORAGE_BUCKET:-}"
      OBJECT_STORAGE_ACCESS_KEY_ID_FILE: /run/secrets/dev_rustfs_access_key
      OBJECT_STORAGE_SECRET_ACCESS_KEY_FILE: /run/secrets/dev_rustfs_secret_key
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      # --- Public hosts (browser-visible) ---
      PUBLIC_AUTH_CORPORATE_URL: auth.umaxica.com
      PUBLIC_AUTH_SERVICE_URL: auth.umaxica.app
      PUBLIC_AUTH_STAFF_URL: auth.umaxica.org
      PUBLIC_BASE_CORPORATE_URL: www.umaxica.com
      PUBLIC_BASE_SERVICE_URL: www.umaxica.app
      PUBLIC_BASE_STAFF_URL: www.umaxica.org
      PUBLIC_BASE_DEVELOPER_URL: www.umaxica.dev
      PUBLIC_SIDE_CORPORATE_URL: side-jp.umaxica.com
      PUBLIC_SIDE_SERVICE_URL: side-jp.umaxica.app
      PUBLIC_SIDE_STAFF_URL: side-jp.umaxica.org
      PUBLIC_CORE_CORPORATE_URL: jp.umaxica.com
      PUBLIC_CORE_SERVICE_URL: jp.umaxica.app
      PUBLIC_CORE_STAFF_URL: jp.umaxica.org
      PUBLIC_PALM_SERVICE_URL: palm-jp.umaxica.app
      PUBLIC_INFO_CORPORATE_URL: info.umaxica.com
      PUBLIC_INFO_SERVICE_URL: info.umaxica.app
      PUBLIC_INFO_STAFF_URL: info.umaxica.org
      PUBLIC_DOCS_CORPORATE_URL: docs.com.localhost
      PUBLIC_DOCS_SERVICE_URL: docs.app.localhost
      PUBLIC_DOCS_STAFF_URL: docs.org.localhost
      PUBLIC_EDGE_CORPORATE_URL: edge.com.localhost
      PUBLIC_EDGE_SERVICE_URL: edge.app.localhost
      PUBLIC_EDGE_STAFF_URL: edge.org.localhost
      PUBLIC_JUMP_GATEWAY_URL: jump.umaxica.net
      PUBLIC_STATUS_URL: status.umaxica.dev
      PUBLIC_ASSET_URL: asset.umaxica.net
      # --- Private origins (pod-internal / tunnel) ---
      PRIVATE_AUTH_CORPORATE_URL: auth.com.localhost
      PRIVATE_AUTH_SERVICE_URL: auth.app.localhost
      PRIVATE_AUTH_STAFF_URL: auth.org.localhost
      PRIVATE_BASE_CORPORATE_URL: base.com.localhost
      PRIVATE_BASE_SERVICE_URL: base.app.localhost
      PRIVATE_BASE_STAFF_URL: base.org.localhost
      PRIVATE_BASE_NETWORK_URL: base.net.localhost
      PRIVATE_BASE_DEVELOPER_URL: base.dev.localhost
      PRIVATE_CORE_CORPORATE_URL: core.com.localhost
      PRIVATE_CORE_SERVICE_URL: core.app.localhost
      PRIVATE_CORE_STAFF_URL: core.org.localhost
      PRIVATE_DOCS_CORPORATE_URL: docs.com.localhost
      PRIVATE_DOCS_SERVICE_URL: docs.app.localhost
      PRIVATE_DOCS_STAFF_URL: docs.org.localhost
      PRIVATE_HELP_CORPORATE_URL: help.com.localhost
      PRIVATE_HELP_SERVICE_URL: help.app.localhost
      PRIVATE_HELP_STAFF_URL: help.org.localhost
      PRIVATE_INFO_CORPORATE_URL: info.com.localhost
      PRIVATE_INFO_SERVICE_URL: info.app.localhost
      PRIVATE_INFO_STAFF_URL: info.org.localhost
      PRIVATE_NEWS_CORPORATE_URL: news.com.localhost
      PRIVATE_NEWS_SERVICE_URL: news.app.localhost
      PRIVATE_NEWS_STAFF_URL: news.org.localhost
      PRIVATE_PALM_SERVICE_URL: palm.app.localhost
      # --- External authentication ceremony availability ---
      # Now runtime Flipper features (:social_ceremony_apple / _google / _entra) stored in
      # the `platform` PostgreSQL database. Enable them with `bin/rails social_ceremony:enable[apple]`.
      # --- JWT leeway ---
      PREFERENCE_JWT_LEEWAY_SECONDS: "30"
      AUTH_JWT_LEEWAY_SECONDS: "30"
      AUTH_JWT_CLIENT_AUDIENCES: umaxica-api-client
      AUTH_JWT_VISITOR_AUDIENCES: umaxica-api-visitor
      AUTH_JWT_OPERATOR_AUDIENCES: umaxica-api-operator
      # --- Vite ---
      VITE_RUBY_PACKAGE_MANAGER: pnpm
      VITE_RUBY_HOST: "0.0.0.0"
      VITE_RUBY_PORT: "3036"
      VITE_GIT_HOOKS: "0"
      # --- pnpm ---
      # Pin the store instead of letting pnpm resolve it: node_modules lives on its
      # own named volume, so pnpm's default resolution falls back to a workspace-local
      # .pnpm-store, which conflicts with the store vite-ruby's own pnpm calls used and
      # fails every session with ERR_PNPM_UNEXPECTED_STORE.
      npm_config_store_dir: /home/global/.local/share/pnpm/store
    restart: always
    # PID 1 owns only fixed initialization and Tailscale responsibilities.
    # core-entrypoint drops the application workload to CORE_WORKLOAD_USER;
    # Dev Container shells also use the non-root containerUser.
    user: root
    # Named volumes for high-write paths prevent rootless podman UID-mapping
    # from rewriting host file ownership on the bind-mounted workspace:
    #   - umaxica-home-cache  → pnpm / Vite / YJIT scratch
    #   - umaxica-home-share  → pnpm store, devcontainer feature state
    #   - umaxica-node-modules → workspace node_modules (off the repo tree)
    #   - umaxica-bundle       → vendor/bundle (off the repo tree)
    # Discard any of these with `podman volume rm <name>` to recover from
    # a corrupted cache without affecting credentials or workspace state.
    volumes:
      - type: volume
        source: umaxica-home-cache
        target: "/home/global/.cache"
      - type: volume
        source: umaxica-home-share
        target: "/home/global/.local/share"
      - type: volume
        source: umaxica-node-modules
        target: "/home/global/workspace/node_modules"
      - type: volume
        source: umaxica-bundle
        target: "/home/global/workspace/vendor/bundle"
    secrets:
      - dev_postgres_writer
      - dev_rustfs_access_key
      - dev_rustfs_secret_key
    # Workspace bind mount, host-port publishing, and host-gateway alias are
    # host-shaped — see the devcontainer override. `BINDING: 0.0.0.0` above is
    # the *container-side* listener and must stay: cloudflare-tunnel and the
    # probe containers reach Rails over the `frontend` network, not through the
    # host. The host-side publication is loopback-only; the two are separate
    # decisions (docs/operations/development-host-port-exposure.md).
    networks:
      backend: {}
      frontend:
        aliases:
          - base.app.localhost
          - base.com.localhost
          - base.org.localhost
          - base.net.localhost
          - base.dev.localhost
          - auth.app.localhost
          - auth.com.localhost
          - auth.org.localhost
          - core.app.localhost
          - core.com.localhost
          - core.org.localhost
          - docs.app.localhost
          - docs.com.localhost
          - docs.org.localhost
          - help.app.localhost
          - help.com.localhost
          - help.org.localhost
          - news.app.localhost
          - news.com.localhost
          - news.org.localhost
          - palm.app.localhost
          - side.app.localhost
          - side.com.localhost
          - side.org.localhost
          - edge.app.localhost
          - edge.com.localhost
          - edge.org.localhost
          - info.app.localhost
          - info.com.localhost
          - info.org.localhost
          # Browser-facing site names (PUBLIC_*_URL). Development is published through
          # Cloudflare Tunnel behind Cloudflare Access, and a Tunnel ingress rule resolves
          # its `service:` address on this network, so the published names have to resolve
          # to `core` here. Only Umaxica-owned names belong in this list.
          # See docs/architecture/cloudflare-request-paths.md.
          - auth.umaxica.app
          - auth.umaxica.com
          - auth.umaxica.org
          - www.umaxica.app
          - www.umaxica.com
          - www.umaxica.org
          - www.umaxica.dev
          - side-jp.umaxica.app
          - side-jp.umaxica.com
          - side-jp.umaxica.org
          - info.umaxica.app
          - info.umaxica.com
          - info.umaxica.org
          # Canonical Core family per adr/core-canonical-public-host.md. The legacy
          # core-jp.*, docs-jp.*, help-jp.*, and news-jp.* aliases are gone: PUBLIC_CORE_*
          # now names jp.umaxica.*, and PUBLIC_DOCS_* names a private *.localhost origin, so
          # those hostnames are no longer configured anywhere and Rails would reject them.
          - jp.umaxica.app
          - jp.umaxica.com
          - jp.umaxica.org
          - palm-jp.umaxica.app
      observability: {}
      outer:
        aliases:
          - global
    depends_on:
      primary:
        condition: service_healthy
      replica:
        condition: service_started
      valkey:
        condition: service_healthy
  rustfs-permissions:
    image: alpine:3.24.1
    profiles:
      - object-storage
    user: root
    read_only: true
    network_mode: none
    security_opt:
      - no-new-privileges:true
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - |
        for directory in /data/rustfs0 /data/rustfs1 /data/rustfs2 /data/rustfs3; do
          chown 10001:10001 "$${directory}"
          chmod 0750 "$${directory}"
        done
    volumes:
      - rustfs-data0:/data/rustfs0
      - rustfs-data1:/data/rustfs1
      - rustfs-data2:/data/rustfs2
      - rustfs-data3:/data/rustfs3
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.10
    profiles:
      - object-storage
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        # Credentials arrive as Podman secrets rather than Compose
        # interpolation, so they never sit in the repository-root .env next to
        # non-secret settings. Command substitution drops the trailing newline
        # that `openssl rand` writes into each secret file.
        for secret in access_key secret_key rpc_secret; do
          path="/run/secrets/dev_rustfs_$${secret}"
          test -s "$${path}" || {
            echo "missing or empty Podman secret: $${path}; run bin/setup-dev-secrets" >&2
            exit 1
          }
        done
        RUSTFS_ACCESS_KEY="$$(cat /run/secrets/dev_rustfs_access_key)"
        RUSTFS_SECRET_KEY="$$(cat /run/secrets/dev_rustfs_secret_key)"
        RUSTFS_RPC_SECRET="$$(cat /run/secrets/dev_rustfs_rpc_secret)"
        export RUSTFS_ACCESS_KEY RUSTFS_SECRET_KEY RUSTFS_RPC_SECRET
        if [ "$${RUSTFS_RPC_SECRET}" = "$${RUSTFS_SECRET_KEY}" ]; then
          echo "dev_rustfs_rpc_secret must differ from dev_rustfs_secret_key" >&2
          exit 1
        fi
        # SigV4 builds the credential scope as
        # `<access key>/<date>/<region>/s3/aws4_request`, so a `/` inside the
        # access key silently corrupts every signature. Reject it here instead
        # of leaving the operator to debug opaque 403 responses.
        case "$${RUSTFS_ACCESS_KEY}" in
          */*)
            echo "dev_rustfs_access_key must not contain '/'; regenerate it with bin/setup-dev-secrets" >&2
            exit 1
            ;;
        esac
        exec /entrypoint.sh rustfs
    environment:
      RUSTFS_VOLUMES: "/data/rustfs{0...3}"
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_REGION: "us-east-1"
    secrets:
      - dev_rustfs_access_key
      - dev_rustfs_secret_key
      - dev_rustfs_rpc_secret
    security_opt:
      - no-new-privileges:true
    restart: "no"
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:9000/health/ready
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - rustfs-data0:/data/rustfs0
      - rustfs-data1:/data/rustfs1
      - rustfs-data2:/data/rustfs2
      - rustfs-data3:/data/rustfs3
    networks:
      - backend
  primary:
    build:
      context: ./podman/psql-pub
      dockerfile: Containerfile
    # Wraps the stock postgres entrypoint so the replication role, the
    # replication slot, and pg_cron are (re)asserted on every start. They were
    # previously created from /docker-entrypoint-initdb.d, which runs only when
    # PGDATA is initialised, so `primary-data` volumes older than any of those
    # additions never received them.
    entrypoint: "/entrypoint.sh"
    command:
      - "-c"
      - config_file=/etc/postgresql/postgresql.conf
      - "-c"
      - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_USER: "${POSTGRESQL_USER:-root}"
      POSTGRES_PASSWORD_FILE: /run/secrets/dev_postgres_writer
      POSTGRES_DB: "${POSTGRESQL_DATABASE:-db}"
      POSTGRES_REPLICATION_USER: "${POSTGRESQL_REPLICATION_USER:-replicator}"
      POSTGRES_REPLICATION_PASSWORD_FILE: /run/secrets/dev_postgres_replication
      TZ: UTC
      POSTGRES_INITDB_WAL_LEVEL: replica
      POSTGRES_INITDB_MAX_WAL_SENDERS: 10
      POSTGRES_INITDB_MAX_REPLICATION_SLOTS: 10
    volumes:
      - primary-data:/var/lib/postgresql/data
      # `:z` adds an SELinux shared label so Fedora/RHEL hosts permit container
      # reads. Harmless on non-SELinux hosts (Arch, Ubuntu).
      - "./podman/psql-pub/entrypoint.sh:/entrypoint.sh:ro,z"
      - "./podman/psql-pub/postgresql.conf:/etc/postgresql/postgresql.conf:ro,z"
      - "./podman/psql-pub/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro,z"
    networks:
      - backend
    secrets:
      - dev_postgres_writer
      - dev_postgres_replication
    restart: unless-stopped
    healthcheck:
      # Also asserts the objects /entrypoint.sh provisions. `replica` gates its
      # pg_basebackup on this healthcheck, so without those two conditions it
      # can race ahead of provisioning, fail to authenticate, and burn its five
      # basebackup attempts before the role exists.
      test:
        - CMD-SHELL
        - export PGPASSWORD="$$(cat "$${POSTGRES_PASSWORD_FILE}")" && pg_isready -U
          "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1 && test "$$(psql -U
          "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1 -Atqc 'SELECT pg_is_in_recovery()')"
          = f && test "$$(psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1 -Atqc
          "SELECT count(*) FROM pg_roles WHERE rolname = '$${POSTGRES_REPLICATION_USER}' AND
          rolreplication")" = 1 && test "$$(psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h
          127.0.0.1 -Atqc "SELECT count(*) FROM pg_replication_slots WHERE slot_name =
          'replication_slot_slave1'")" = 1
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
  replica:
    build:
      context: ./podman/psql-sub
      dockerfile: Containerfile
    entrypoint: "/entrypoint.sh"
    environment:
      POSTGRES_USER: "${POSTGRESQL_USER:-root}"
      POSTGRES_PASSWORD_FILE: /run/secrets/dev_postgres_writer
      POSTGRES_DB: "${POSTGRESQL_DATABASE:-db}"
      POSTGRES_REPLICATION_USER: "${POSTGRESQL_REPLICATION_USER:-replicator}"
      POSTGRES_REPLICATION_PASSWORD_FILE: /run/secrets/dev_postgres_replication
      TZ: UTC
    volumes:
      - replica-data:/var/lib/postgresql/data
      - "./podman/psql-sub/entrypoint.sh:/entrypoint.sh:ro,z"
      - "./podman/psql-sub/postgresql.conf:/etc/postgresql/postgresql.conf:ro,z"
      - "./podman/psql-sub/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro,z"
    depends_on:
      primary:
        condition: service_healthy
    networks:
      - backend
    secrets:
      - dev_postgres_writer
      - dev_postgres_replication
    restart: unless-stopped
    healthcheck:
      # No backslash-escaped quotes: CMD-SHELL runs this under `sh -c`, where
      # `\"` is a literal quote rather than a nesting escape, and the whole
      # probe dies with `Syntax error: "(" unexpected` before it ever reaches
      # psql -- a check that can only fail, never pass. Plain double quotes
      # nest correctly inside "$(...)".
      test:
        - CMD-SHELL
        - export PGPASSWORD="$$(cat "$${POSTGRES_PASSWORD_FILE}")" && pg_isready -U
          "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1 && test "$$(psql -U
          "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1 -Atqc 'SELECT pg_is_in_recovery()')"
          = t && test "$$(psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1 -Atqc
          "SELECT count(*) > 0 FROM pg_stat_wal_receiver WHERE status = 'streaming'")" = t
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
  valkey:
    image: valkey/valkey:8.0-alpine3.22
    networks:
      - backend
    volumes:
      - valkey-volume:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - valkey-cli
        - ping
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 3s
  kafka:
    image: confluentinc/cp-kafka:7.9.0
    hostname: kafka
    # The Confluent entrypoint writes generated configuration under /etc/kafka.
    # Run it as container root so that directory remains writable through
    # rootless Podman's host-user UID mapping.
    user: root
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners only, both bound to the `kafka` container address on the
      # `backend` network. The former EXTERNAL listener (0.0.0.0:9092,
      # advertised as localhost:9092) existed solely to serve the host port
      # publication, and nothing consumes it: the repository has no Kafka
      # client. Gemfile.lock carries only opentelemetry-instrumentation-*
      # shims, which instrument a client that is not installed. Removing the
      # listener keeps 9092 from being reachable from anywhere at all, rather
      # than leaving an unauthenticated PLAINTEXT broker listening on every
      # container interface. See
      # docs/operations/development-host-port-exposure.md.
      KAFKA_LISTENERS: CONTROLLER://kafka:29093,INTERNAL://kafka:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: q1Sh-9_ISia_zwGINzRvyQ
    networks:
      - backend
    restart: unless-stopped
    # No host port publication, here or in any override: the broker is a
    # `backend`-network-only service reached as `kafka:29092`.
    healthcheck:
      test:
        - CMD
        - kafka-broker-api-versions
        - "--bootstrap-server"
        - kafka:29092
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  loki:
    image: grafana/loki:latest
    # Rootless podman creates named volumes as the host user. Running these
    # opt-in observability services as container root keeps their data
    # directories writable without changing host ownership.
    user: root
    profiles:
      - observability
    command: "-config.file=/etc/loki/local-config.yaml"
    volumes:
      - loki-volume:/tmp/loki
    networks:
      - observability
    restart: "no"
  tempo:
    image: grafana/tempo:2.10.5
    # See loki: rootless podman named-volume ownership needs the container
    # writer to map back to the host user.
    user: root
    profiles:
      - observability
    command:
      - "-config.file=/etc/tempo.yaml"
    # No host port publication. Tempo's 3200/4317/4318/9411 are consumed only
    # on the `observability` network -- Grafana queries `tempo:3200` and the
    # collector exports to `tempo:4317` -- and Grafana itself publishes no host
    # port either, so nothing on the host ever dialed these.
    volumes:
      - "./podman/tempo/tempo.yaml:/etc/tempo.yaml:ro,z"
      - tempo-volume:/var/tempo
    networks:
      - observability
    restart: "no"
  grafana:
    image: grafana/grafana:latest
    # Grafana writes SQLite migrations under /var/lib/grafana; with rootless
    # podman the named volume can otherwise appear read-only to Grafana's UID.
    user: root
    profiles:
      - observability
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_PATHS_PROVISIONING: "/etc/grafana/provisioning"
    volumes:
      - grafana-volume:/var/lib/grafana
      - "./podman/grafana/provisioning:/etc/grafana/provisioning:z"
    networks:
      - observability
    depends_on:
      - loki
      - tempo
      - prometheus
    restart: "no"
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    profiles:
      - observability
    volumes:
      - "./podman/otel-collector/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro,z"
    networks:
      - observability
    depends_on:
      - tempo
    restart: "no"
  prometheus:
    image: prom/prometheus:latest
    # Prometheus writes its TSDB under /prometheus; keep rootless podman named
    # volumes writable when the observability profile is explicitly enabled.
    user: root
    profiles:
      - observability
    volumes:
      - "./podman/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z"
      - prometheus-volume:/prometheus
    networks:
      - observability
    restart: "no"
networks:
  backend: {}
  frontend: {}
  observability: {}
  outer:
    name: "${OUTER_DOCKER_NETWORK:-umaxica-apps-global_outer}"
    # Keep this network Compose-managed. Interpolating `external` produces a
    # string, which podman-compose cannot safely treat as the boolean required
    # by the Compose model and causes `up` to fail while building network args.
    external: false
  # NOTE: `cloudflare-tunnel` lives entirely in compose.custom.yaml (repo
  # root) -- an always-on, unprofiled
  # overlay that is included unconditionally via
  # .devcontainer/devcontainer.json's dockerComposeFile array. This base
  # compose.yaml alone must never create, start, or pull it. See
  # docs/operations/cloudflare-private-origin.md.
volumes:
  primary-data: {}
  replica-data: {}
  valkey-volume: {}
  loki-volume: {}
  tempo-volume: {}
  grafana-volume: {}
  prometheus-volume: {}
  umaxica-home-cache: {}
  umaxica-home-share: {}
  umaxica-node-modules: {}
  umaxica-bundle: {}
  rustfs-data0: {}
  rustfs-data1: {}
  rustfs-data2: {}
  rustfs-data3: {}
secrets:
  dev_postgres_writer:
    external: true
  dev_postgres_replication:
    external: true
  dev_rustfs_access_key:
    external: true
  dev_rustfs_secret_key:
    external: true
  dev_rustfs_rpc_secret:
    external: true
