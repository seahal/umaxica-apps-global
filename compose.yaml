---
name: umaxica-apps-global
services:
  core:
    build:
      context: "."
      dockerfile: "./Dockerfile"
      target: development
      args:
        COMMIT_HASH: abcdef
        # DOCKER_UID/DOCKER_GID are host-shaped; they are supplied by the
        # devcontainer override (.devcontainer/compose.override.yml).
    entrypoint:
      - "/usr/local/bin/core-entrypoint"
    # core-dev-supervisor keeps PID 1 alive across a single Procfile.dev
    # process (web/vite/jobs) dying -- foreman's default behavior is to
    # SIGTERM/SIGKILL its whole group and exit when any one of them exits,
    # which would otherwise take the container down with it.
    command:
      - /usr/local/bin/core-dev-supervisor
      - bin/dev
    environment:
      # --- Shell / productivity ---
      COLORTERM: truecolor
      # --- Ruby / Bundler ---
      RUBY_PATH: /usr/local/bin/ruby
      BUNDLE_PATH: vendor/bundle
      # --- Rails server ---
      BRAND_NAME: UMAXICA
      PORT: "3000"
      BINDING: "0.0.0.0"
      OPEN_TELEMETRY: "false"
      NODE_ENV: development
      # --- PostgreSQL credentials (injected from host .env with local defaults) ---
      POSTGRESQL_USER: "${POSTGRESQL_USER:-root}"
      POSTGRESQL_PASSWORD: "${POSTGRESQL_PASSWORD:-development_password}"
      POSTGRESQL_DATABASE: "${POSTGRESQL_DATABASE:-db}"
      # --- Identifier HMAC salts (dev-only fixed values; differ from production) ---
      EMAIL_ADDRESS_HMAC_SALT: "${EMAIL_ADDRESS_HMAC_SALT:-development_email_address_hmac_salt}"
      TELEPHONE_NUMBER_HMAC_SALT: "${TELEPHONE_NUMBER_HMAC_SALT:-development_telephone_number_hmac_salt}"
      # --- Unified Enforcement identifier HMAC keys (adr/unified-enforcement.md,
      #     D6) -- dedicated per-realm keys, deliberately distinct from the
      #     credential-lookup salts above; dev-only fixed values, differ from
      #     production. ---
      ENFORCEMENT_APP_IDENTIFIER_HMAC_KEY: "${ENFORCEMENT_APP_IDENTIFIER_HMAC_KEY:-development_enforcement_app_identifier_hmac_key}"
      ENFORCEMENT_COM_IDENTIFIER_HMAC_KEY: "${ENFORCEMENT_COM_IDENTIFIER_HMAC_KEY:-development_enforcement_com_identifier_hmac_key}"
      ENFORCEMENT_ORG_IDENTIFIER_HMAC_KEY: "${ENFORCEMENT_ORG_IDENTIFIER_HMAC_KEY:-development_enforcement_org_identifier_hmac_key}"
      # --- PostgreSQL topology ---
      POSTGRESQL_HOST: primary
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_OCCURRENCE_PUB: primary
      POSTGRESQL_OCCURRENCE_SUB: replica
      POSTGRESQL_CHRONICLE_PUB: primary
      POSTGRESQL_CHRONICLE_SUB: replica
      POSTGRESQL_GUEST_PUB: primary
      POSTGRESQL_GUEST_SUB: replica
      POSTGRESQL_IDENTITY_PUB: primary
      POSTGRESQL_IDENTITY_SUB: replica
      POSTGRESQL_PRINCIPAL_PUB: primary
      POSTGRESQL_PRINCIPAL_SUB: replica
      POSTGRESQL_PROFILE_PUB: primary
      POSTGRESQL_PROFILE_SUB: replica
      POSTGRESQL_COMMERCE_PUB: primary
      POSTGRESQL_COMMERCE_SUB: replica
      POSTGRESQL_TOKEN_PUB: primary
      POSTGRESQL_TOKEN_SUB: replica
      POSTGRESQL_MESSAGE_PUB: primary
      POSTGRESQL_MESSAGE_SUB: replica
      POSTGRESQL_NOTIFICATION_PUB: primary
      POSTGRESQL_NOTIFICATION_SUB: replica
      POSTGRESQL_CACHE_PUB: primary
      POSTGRESQL_CACHE_SUB: replica
      POSTGRESQL_STORAGE_PUB: primary
      POSTGRESQL_STORAGE_SUB: replica
      POSTGRESQL_PUBLISHING_PUB: primary
      POSTGRESQL_PUBLISHING_SUB: replica
      POSTGRESQL_QUEUE_PUB: primary
      POSTGRESQL_QUEUE_SUB: replica
      POSTGRESQL_OPERATOR_PUB: primary
      POSTGRESQL_OPERATOR_SUB: replica
      POSTGRESQL_AVATAR_PUB: primary
      POSTGRESQL_AVATAR_SUB: replica
      POSTGRESQL_REDIRECTOR_PUB: primary
      POSTGRESQL_REDIRECTOR_SUB: replica
      POSTGRESQL_SEARCH_PUB: primary
      POSTGRESQL_SEARCH_SUB: replica
      # --- Redis / Valkey ---
      VALKEY_URL: "redis://valkey:6379/0"
      RATE_LIMIT_REDIS_URL: "redis://valkey:6379/1"
      REDIS_NORMAL_URL: "redis://valkey:6379/7"
      # --- Observability ---
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      # --- Mail ---
      AWS_SES_REGION: ap-northeast-1
      # --- Local object storage (optional profile) ---
      OBJECT_STORAGE_ENDPOINT: "http://rustfs:9000"
      OBJECT_STORAGE_REGION: "us-east-1"
      OBJECT_STORAGE_BUCKET: "${OBJECT_STORAGE_BUCKET:-}"
      OBJECT_STORAGE_ACCESS_KEY_ID: "${OBJECT_STORAGE_ACCESS_KEY_ID:-}"
      OBJECT_STORAGE_SECRET_ACCESS_KEY: "${OBJECT_STORAGE_SECRET_ACCESS_KEY:-}"
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      # --- Public hosts (browser-visible) ---
      PUBLIC_AUTH_CORPORATE_URL: auth.umaxica.com
      PUBLIC_AUTH_SERVICE_URL: auth.umaxica.app
      PUBLIC_AUTH_STAFF_URL: auth.umaxica.org
      PUBLIC_BASE_CORPORATE_URL: www.umaxica.com
      PUBLIC_BASE_SERVICE_URL: www.umaxica.app
      PUBLIC_BASE_STAFF_URL: www.umaxica.org
      PUBLIC_SIDE_CORPORATE_URL: side-jp.umaxica.com
      PUBLIC_SIDE_SERVICE_URL: side-jp.umaxica.app
      PUBLIC_SIDE_STAFF_URL: side-jp.umaxica.org
      PUBLIC_CORE_CORPORATE_URL: core-jp.umaxica.com
      PUBLIC_CORE_SERVICE_URL: core-jp.umaxica.app
      PUBLIC_CORE_STAFF_URL: core-jp.umaxica.org
      PUBLIC_PALM_SERVICE_URL: palm-jp.umaxica.app
      PUBLIC_INFO_CORPORATE_URL: info.umaxica.com
      PUBLIC_INFO_SERVICE_URL: info.umaxica.app
      PUBLIC_INFO_STAFF_URL: info.umaxica.org
      PUBLIC_DOCS_CORPORATE_URL: docs.com.localhost
      PUBLIC_DOCS_SERVICE_URL: docs.app.localhost
      PUBLIC_DOCS_STAFF_URL: docs.org.localhost
      PUBLIC_EDGE_CORPORATE_URL: edge.com.localhost
      PUBLIC_EDGE_SERVICE_URL: edge.app.localhost
      PUBLIC_EDGE_STAFF_URL: edge.org.localhost
      PUBLIC_JUMP_GATEWAY_URL: jump.umaxica.net
      PUBLIC_STATUS_URL: status.umaxica.dev
      PUBLIC_ASSET_URL: asset.umaxica.net
      # --- Private origins (pod-internal / tunnel) ---
      PRIVATE_AUTH_CORPORATE_URL: auth.com.localhost
      PRIVATE_AUTH_SERVICE_URL: auth.app.localhost
      PRIVATE_AUTH_STAFF_URL: auth.org.localhost
      PRIVATE_BASE_CORPORATE_URL: base.com.localhost
      PRIVATE_BASE_SERVICE_URL: base.app.localhost
      PRIVATE_BASE_STAFF_URL: base.org.localhost
      PRIVATE_BASE_NETWORK_URL: base.net.localhost
      PRIVATE_BASE_DEVELOPER_URL: base.dev.localhost
      PRIVATE_CORE_CORPORATE_URL: core.com.localhost
      PRIVATE_CORE_SERVICE_URL: core.app.localhost
      PRIVATE_CORE_STAFF_URL: core.org.localhost
      PRIVATE_DOCS_CORPORATE_URL: docs.com.localhost
      PRIVATE_DOCS_SERVICE_URL: docs.app.localhost
      PRIVATE_DOCS_STAFF_URL: docs.org.localhost
      PRIVATE_HELP_CORPORATE_URL: help.com.localhost
      PRIVATE_HELP_SERVICE_URL: help.app.localhost
      PRIVATE_HELP_STAFF_URL: help.org.localhost
      PRIVATE_INFO_CORPORATE_URL: info.com.localhost
      PRIVATE_INFO_SERVICE_URL: info.app.localhost
      PRIVATE_INFO_STAFF_URL: info.org.localhost
      PRIVATE_NEWS_CORPORATE_URL: news.com.localhost
      PRIVATE_NEWS_SERVICE_URL: news.app.localhost
      PRIVATE_NEWS_STAFF_URL: news.org.localhost
      PRIVATE_PALM_SERVICE_URL: palm.app.localhost
      # --- JWT leeway ---
      PREFERENCE_JWT_LEEWAY_SECONDS: "30"
      AUTH_JWT_LEEWAY_SECONDS: "30"
      # --- Vite ---
      VITE_RUBY_PACKAGE_MANAGER: pnpm
      VITE_RUBY_HOST: "0.0.0.0"
      VITE_RUBY_PORT: "3036"
      VITE_GIT_HOOKS: "0"
    restart: always
    # PID 1 owns only fixed initialization and Tailscale responsibilities.
    # core-entrypoint drops the application workload to CORE_WORKLOAD_USER;
    # Dev Container shells also use the non-root containerUser.
    user: root
    tmpfs:
      # tmpfs uid=/gid= options are rejected by rootless podman. Mode 1777 +
      # sticky bit lets the in-container user write under root-owned tmpfs.
      # /tmp and tmp/pids are on tmpfs so stale server.pid never survives a
      # container restart ("A server is already running" error).
      - /tmp
      - /home/global/workspace/tmp
      - /home/global/workspace/tmp/pids
      - /home/global/workspace/log
    # Named volumes for high-write paths prevent rootless podman UID-mapping
    # from rewriting host file ownership on the bind-mounted workspace:
    #   - umaxica-home-cache  → pnpm / corepack / Vite+ / YJIT scratch
    #   - umaxica-home-share  → pnpm store, devcontainer feature state
    #   - umaxica-node-modules → workspace node_modules (off the repo tree)
    #   - umaxica-bundle       → vendor/bundle (off the repo tree)
    # Discard any of these with `podman volume rm <name>` to recover from
    # a corrupted cache without affecting credentials or workspace state.
    volumes:
      - type: volume
        source: umaxica-home-cache
        target: "/home/global/.cache"
      - type: volume
        source: umaxica-home-share
        target: "/home/global/.local/share"
      - type: volume
        source: umaxica-node-modules
        target: "/home/global/workspace/node_modules"
      - type: volume
        source: umaxica-bundle
        target: "/home/global/workspace/vendor/bundle"
    # Workspace bind mount, host-port publishing, and host-gateway alias are
    # host-shaped — see the devcontainer override.
    networks:
      backend: {}
      frontend:
        aliases:
          - base.app.localhost
          - base.com.localhost
          - base.org.localhost
          - base.net.localhost
          - base.dev.localhost
          - auth.app.localhost
          - auth.com.localhost
          - auth.org.localhost
          - core.app.localhost
          - core.com.localhost
          - core.org.localhost
          - docs.app.localhost
          - docs.com.localhost
          - docs.org.localhost
          - help.app.localhost
          - help.com.localhost
          - help.org.localhost
          - news.app.localhost
          - news.com.localhost
          - news.org.localhost
          - palm.app.localhost
          - side.app.localhost
          - side.com.localhost
          - side.org.localhost
          - edge.app.localhost
          - edge.com.localhost
          - edge.org.localhost
          - info.app.localhost
          - info.com.localhost
          - info.org.localhost
          - auth.umaxica.app
          - auth.umaxica.com
          - auth.umaxica.org
          - www.umaxica.app
          - www.umaxica.com
          - www.umaxica.org
          - side-jp.umaxica.app
          - side-jp.umaxica.com
          - side-jp.umaxica.org
          - info.umaxica.app
          - info.umaxica.com
          - info.umaxica.org
          - core-jp.umaxica.app
          - core-jp.umaxica.com
          - core-jp.umaxica.org
          - palm-jp.umaxica.app
          - docs-jp.umaxica.app
          - docs-jp.umaxica.com
          - docs-jp.umaxica.org
          - help-jp.umaxica.app
          - help-jp.umaxica.com
          - help-jp.umaxica.org
          - news-jp.umaxica.app
          - news-jp.umaxica.com
          - news-jp.umaxica.org
      observability: {}
      outer:
        aliases:
          - global
    depends_on:
      primary:
        condition: service_healthy
      replica:
        condition: service_started
      valkey:
        condition: service_healthy
  rustfs-permissions:
    image: alpine:3.24.1
    profiles:
      - object-storage
    user: root
    read_only: true
    network_mode: none
    security_opt:
      - no-new-privileges:true
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - |
        for directory in /data/rustfs0 /data/rustfs1 /data/rustfs2 /data/rustfs3; do
          chown 10001:10001 "$${directory}"
          chmod 0750 "$${directory}"
        done
    volumes:
      - rustfs-data0:/data/rustfs0
      - rustfs-data1:/data/rustfs1
      - rustfs-data2:/data/rustfs2
      - rustfs-data3:/data/rustfs3
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.10
    profiles:
      - object-storage
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        : "$${RUSTFS_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY_ID must be set}"
        : "$${RUSTFS_SECRET_KEY:?OBJECT_STORAGE_SECRET_ACCESS_KEY must be set}"
        : "$${RUSTFS_RPC_SECRET:?RUSTFS_RPC_SECRET must be set}"
        if [ "$${RUSTFS_RPC_SECRET}" = "$${RUSTFS_SECRET_KEY}" ]; then
          echo "RUSTFS_RPC_SECRET must differ from OBJECT_STORAGE_SECRET_ACCESS_KEY" >&2
          exit 1
        fi
        exec /entrypoint.sh rustfs
    environment:
      RUSTFS_VOLUMES: "/data/rustfs{0...3}"
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_REGION: "us-east-1"
      RUSTFS_ACCESS_KEY: "${OBJECT_STORAGE_ACCESS_KEY_ID:-}"
      RUSTFS_SECRET_KEY: "${OBJECT_STORAGE_SECRET_ACCESS_KEY:-}"
      RUSTFS_RPC_SECRET: "${RUSTFS_RPC_SECRET:-}"
    security_opt:
      - no-new-privileges:true
    restart: "no"
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:9000/health/ready
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - rustfs-data0:/data/rustfs0
      - rustfs-data1:/data/rustfs1
      - rustfs-data2:/data/rustfs2
      - rustfs-data3:/data/rustfs3
    networks:
      - backend
  primary:
    build:
      context: ./docker/psql-pub
      dockerfile: Dockerfile
    command:
      - "-c"
      - config_file=/etc/postgresql/postgresql.conf
      - "-c"
      - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_USER: "${POSTGRESQL_USER:-root}"
      POSTGRES_PASSWORD: "${POSTGRESQL_PASSWORD:-development_password}"
      POSTGRES_DB: "${POSTGRESQL_DATABASE:-db}"
      POSTGRES_REPLICATION_USER: "${POSTGRESQL_REPLICATION_USER:-replicator}"
      POSTGRES_REPLICATION_PASSWORD: "${POSTGRESQL_REPLICATION_PASSWORD:-development_replication_password}"
      TZ: UTC
      POSTGRES_INITDB_WAL_LEVEL: replica
      POSTGRES_INITDB_MAX_WAL_SENDERS: 10
      POSTGRES_INITDB_MAX_REPLICATION_SLOTS: 10
    # Explicit tmpfs cap: writer DBs hold dev (~17G) plus 27 writer test DBs ×
    # up to 32 parallel-test workers (per-worker copies dbname_<n>) in RAM. 64G
    # gives headroom for that fanout without letting the mount grow unbounded.
    # Override POSTGRES_PRIMARY_TMPFS_SIZE on memory-constrained hosts (rootless
    # podman bills tmpfs against the user memory cgroup).
    tmpfs:
      - "/var/lib/postgresql/data:size=${POSTGRES_PRIMARY_TMPFS_SIZE:-64g}"
    # PG allocates 32MB DSM segments from /dev/shm for parallel query and
    # column-metadata joins. The default 64MB container shm exhausts under
    # 32 Rails parallel workers; 4G covers worst-case fanout with margin.
    shm_size: 4gb
    volumes:
      # `:z` adds an SELinux shared label so Fedora/RHEL hosts permit container
      # reads. Harmless on non-SELinux hosts (Arch, Ubuntu).
      - "./docker/psql-pub/postgresql.conf:/etc/postgresql/postgresql.conf:ro,z"
      - "./docker/psql-pub/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro,z"
      - "./docker/psql-pub:/docker-entrypoint-initdb.d:ro,z"
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
  replica:
    build:
      context: ./docker/psql-sub
      dockerfile: Dockerfile
    entrypoint: "/entrypoint.sh"
    environment:
      POSTGRES_USER: "${POSTGRESQL_USER:-root}"
      POSTGRES_PASSWORD: "${POSTGRESQL_PASSWORD:-development_password}"
      POSTGRES_DB: "${POSTGRESQL_DATABASE:-db}"
      POSTGRES_REPLICATION_USER: "${POSTGRESQL_REPLICATION_USER:-replicator}"
      POSTGRES_REPLICATION_PASSWORD: "${POSTGRESQL_REPLICATION_PASSWORD:-development_replication_password}"
      TZ: UTC
    # Replica holds dev read-replica copies plus 27 reader test DBs × up to 32
    # parallel-test workers (test reader DBs are physically separate per
    # notes/.../2026-05-31-test-parallel-reader-writer-db-split.md). 48G covers
    # the expected ~40G working set with margin. Override
    # POSTGRES_REPLICA_TMPFS_SIZE on memory-constrained hosts.
    tmpfs:
      - "/var/lib/postgresql/data:size=${POSTGRES_REPLICA_TMPFS_SIZE:-48g}"
    # Match primary: parallel query + metadata-join DSM segments under 32 Rails
    # workers exceed the 64MB default container shm.
    shm_size: 4gb
    volumes:
      - "./docker/psql-sub/entrypoint.sh:/entrypoint.sh:ro,z"
      - "./docker/psql-sub/postgresql.conf:/etc/postgresql/postgresql.conf:ro,z"
      - "./docker/psql-sub/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro,z"
    depends_on:
      primary:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
  valkey:
    image: valkey/valkey:8.0-alpine3.22
    networks:
      - backend
    volumes:
      - valkey-volume:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - valkey-cli
        - ping
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 3s
  kafka:
    image: confluentinc/cp-kafka:7.9.0
    hostname: kafka
    # The Confluent entrypoint writes generated configuration under /etc/kafka.
    # Run it as container root so that directory remains writable through
    # rootless Podman's host-user UID mapping.
    user: root
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://kafka:29093,INTERNAL://kafka:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: q1Sh-9_ISia_zwGINzRvyQ
    networks:
      - backend
    restart: unless-stopped
    # Host port publishing lives in the devcontainer override.
    healthcheck:
      test:
        - CMD
        - kafka-broker-api-versions
        - "--bootstrap-server"
        - localhost:9092
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  loki:
    image: grafana/loki:latest
    # Rootless podman creates named volumes as the host user. Running these
    # opt-in observability services as container root keeps their data
    # directories writable without changing host ownership.
    user: root
    profiles:
      - observability
    command: "-config.file=/etc/loki/local-config.yaml"
    volumes:
      - loki-volume:/tmp/loki
    networks:
      - observability
    restart: "no"
  tempo:
    image: grafana/tempo:2.10.5
    # See loki: rootless podman named-volume ownership needs the container
    # writer to map back to the host user.
    user: root
    profiles:
      - observability
    command:
      - "-config.file=/etc/tempo.yaml"
    # Host port publishing lives in the devcontainer override.
    volumes:
      - "./docker/tempo/tempo.yaml:/etc/tempo.yaml:ro,z"
      - tempo-volume:/var/tempo
    networks:
      - observability
    restart: "no"
  grafana:
    image: grafana/grafana:latest
    # Grafana writes SQLite migrations under /var/lib/grafana; with rootless
    # podman the named volume can otherwise appear read-only to Grafana's UID.
    user: root
    profiles:
      - observability
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_PATHS_PROVISIONING: "/etc/grafana/provisioning"
    volumes:
      - grafana-volume:/var/lib/grafana
      - "./docker/grafana/provisioning:/etc/grafana/provisioning:z"
    networks:
      - observability
    depends_on:
      - loki
      - tempo
      - prometheus
    restart: "no"
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    profiles:
      - observability
    volumes:
      - "./docker/otel-collector/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro,z"
    networks:
      - observability
    depends_on:
      - tempo
    restart: "no"
  prometheus:
    image: prom/prometheus:latest
    # Prometheus writes its TSDB under /prometheus; keep rootless podman named
    # volumes writable when the observability profile is explicitly enabled.
    user: root
    profiles:
      - observability
    volumes:
      - "./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z"
      - prometheus-volume:/prometheus
    networks:
      - observability
    restart: "no"
networks:
  backend: {}
  frontend: {}
  observability: {}
  outer:
    name: "${OUTER_DOCKER_NETWORK:-umaxica-apps-global_outer}"
    external: "${OUTER_DOCKER_NETWORK_EXTERNAL:-false}"
  # NOTE: `cloudflare-tunnel` lives entirely in compose.custom.yaml (repo
  # root) -- an always-on, unprofiled
  # overlay that is included unconditionally via
  # .devcontainer/devcontainer.json's dockerComposeFile array. This base
  # compose.yaml alone must never create, start, or pull it. Likewise
  # `pgadmin`/`tinyrdm` (admin GUIs) are defined entirely in
  # compose.custom.yaml, not here. See docs/operations/remote-codex-over-tailscale.md
  # and docs/operations/cloudflare-private-origin.md.
volumes:
  valkey-volume: {}
  loki-volume: {}
  tempo-volume: {}
  grafana-volume: {}
  prometheus-volume: {}
  umaxica-home-cache: {}
  umaxica-home-share: {}
  umaxica-node-modules: {}
  umaxica-bundle: {}
  rustfs-data0: {}
  rustfs-data1: {}
  rustfs-data2: {}
  rustfs-data3: {}
