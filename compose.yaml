---
name: umaxica-apps-global
services:
  core:
    build:
      context: "."
      dockerfile: "./Dockerfile"
      args:
        COMMIT_HASH: abcdef
        # DOCKER_UID/DOCKER_GID are host-shaped; they are supplied by the
        # devcontainer override (.devcontainer/compose.override.yml).
    env_file: docker/core/env
    entrypoint:
    - "/bin/bash"
    - "/home/global/workspace/docker/core/entrypoint.sh"
    command:
    - bin/dev
    environment:
      POSTGRESQL_USER: "${POSTGRESQL_USER:-root}"
      POSTGRESQL_PASSWORD: "${POSTGRESQL_PASSWORD:-development_password}"
      POSTGRESQL_DATABASE: "${POSTGRESQL_DATABASE:-db}"
    restart: always
    # The image's USER is baked from DOCKER_UID/DOCKER_GID at build time, so
    # we do not also pin `user:` in compose — pinning here conflicts with
    # rootless podman's `userns_mode: keep-id` (set in the devcontainer
    # override) and the double mapping breaks bind-mount ownership.
    tmpfs:
    # tmpfs uid=/gid= options are rejected by rootless podman. Mode 1777 +
    # sticky bit lets the in-container user write under root-owned tmpfs.
    # /tmp and tmp/pids are on tmpfs so stale server.pid never survives a
    # container restart ("A server is already running" error).
    - /tmp
    - /home/global/workspace/tmp
    - /home/global/workspace/tmp/pids
    - /home/global/workspace/log
    # Named volumes for high-write paths prevent rootless podman UID-mapping
    # from rewriting host file ownership on the bind-mounted workspace:
    #   - umaxica-home-cache  → pnpm / corepack / Vite+ / YJIT scratch
    #   - umaxica-home-share  → pnpm store, devcontainer feature state
    #   - umaxica-node-modules → workspace node_modules (off the repo tree)
    #   - umaxica-bundle       → vendor/bundle (off the repo tree)
    # Discard any of these with `podman volume rm <name>` to recover from
    # a corrupted cache without affecting credentials or workspace state.
    volumes:
    - type: volume
      source: umaxica-home-cache
      target: "/home/global/.cache"
    - type: volume
      source: umaxica-home-share
      target: "/home/global/.local/share"
    - type: volume
      source: umaxica-node-modules
      target: "/home/global/workspace/node_modules"
    - type: volume
      source: umaxica-bundle
      target: "/home/global/workspace/vendor/bundle"
    # Workspace bind mount, host-port publishing, and host-gateway alias are
    # host-shaped — see the devcontainer override.
    networks:
      backend: {}
      frontend:
        aliases:
          - id.app.localhost
          - id.com.localhost
          - id.org.localhost
          - id.umaxica.app
          - id.umaxica.com
          - id.umaxica.org
          - www-jp.umaxica.app
          - www-jp.umaxica.com
          - www-jp.umaxica.org
          - palm-jp.umaxica.app
          - docs.jp.umaxica.app
          - docs.jp.umaxica.com
          - docs.jp.umaxica.org
          - help.jp.umaxica.app
          - help.jp.umaxica.com
          - help.jp.umaxica.org
          - news.jp.umaxica.app
          - news.jp.umaxica.com
          - news.jp.umaxica.org
          - core.app.localhost
          - core.com.localhost
          - core.org.localhost
          - www.app.localhost
          - www.com.localhost
          - www.org.localhost
          - base.app.localhost
          - base.com.localhost
          - base.org.localhost
          - palm.app.localhost
      observability: {}
      outer:
        aliases:
        - global
    depends_on:
      primary:
        condition: service_healthy
      replica:
        condition: service_started
      valkey:
        condition: service_healthy
      otel-collector:
        condition: service_started
  primary:
    image: postgres:17.7-alpine
    command:
    - "-c"
    - config_file=/etc/postgresql/postgresql.conf
    - "-c"
    - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_USER: "${POSTGRESQL_USER:-root}"
      POSTGRES_PASSWORD: "${POSTGRESQL_PASSWORD:-development_password}"
      POSTGRES_DB: "${POSTGRESQL_DATABASE:-db}"
      POSTGRES_REPLICATION_USER: "${POSTGRESQL_REPLICATION_USER:-replicator}"
      POSTGRES_REPLICATION_PASSWORD: "${POSTGRESQL_REPLICATION_PASSWORD:-development_replication_password}"
      TZ: UTC
      POSTGRES_INITDB_WAL_LEVEL: replica
      POSTGRES_INITDB_MAX_WAL_SENDERS: 10
      POSTGRES_INITDB_MAX_REPLICATION_SLOTS: 10
    # Explicit tmpfs cap: writer DBs hold dev (~17G) plus 27 writer test DBs ×
    # up to 32 parallel-test workers (per-worker copies dbname_<n>) in RAM. 64G
    # gives headroom for that fanout without letting the mount grow unbounded.
    # Override POSTGRES_PRIMARY_TMPFS_SIZE on memory-constrained hosts (rootless
    # podman bills tmpfs against the user memory cgroup).
    tmpfs:
    - "/var/lib/postgresql/data:size=${POSTGRES_PRIMARY_TMPFS_SIZE:-64g}"
    # PG allocates 32MB DSM segments from /dev/shm for parallel query and
    # column-metadata joins. The default 64MB container shm exhausts under
    # 32 Rails parallel workers; 4G covers worst-case fanout with margin.
    shm_size: 4gb
    volumes:
    # `:z` adds an SELinux shared label so Fedora/RHEL hosts permit container
    # reads. Harmless on non-SELinux hosts (Arch, Ubuntu).
    - "./docker/psql-pub/postgresql.conf:/etc/postgresql/postgresql.conf:ro,z"
    - "./docker/psql-pub/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro,z"
    - "./docker/psql-pub:/docker-entrypoint-initdb.d:ro,z"
    networks:
    - backend
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
  replica:
    image: postgres:17.7-alpine
    entrypoint: "/entrypoint.sh"
    environment:
      POSTGRES_USER: "${POSTGRESQL_USER:-root}"
      POSTGRES_PASSWORD: "${POSTGRESQL_PASSWORD:-development_password}"
      POSTGRES_DB: "${POSTGRESQL_DATABASE:-db}"
      POSTGRES_REPLICATION_USER: "${POSTGRESQL_REPLICATION_USER:-replicator}"
      POSTGRES_REPLICATION_PASSWORD: "${POSTGRESQL_REPLICATION_PASSWORD:-development_replication_password}"
      TZ: UTC
    # Replica holds dev read-replica copies plus 27 reader test DBs × up to 32
    # parallel-test workers (test reader DBs are physically separate per
    # notes/.../2026-05-31-test-parallel-reader-writer-db-split.md). 48G covers
    # the expected ~40G working set with margin. Override
    # POSTGRES_REPLICA_TMPFS_SIZE on memory-constrained hosts.
    tmpfs:
    - "/var/lib/postgresql/data:size=${POSTGRES_REPLICA_TMPFS_SIZE:-48g}"
    # Match primary: parallel query + metadata-join DSM segments under 32 Rails
    # workers exceed the 64MB default container shm.
    shm_size: 4gb
    volumes:
    - "./docker/psql-sub/entrypoint.sh:/entrypoint.sh:ro,z"
    - "./docker/psql-sub/postgresql.conf:/etc/postgresql/postgresql.conf:ro,z"
    - "./docker/psql-sub/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro,z"
    depends_on:
      primary:
        condition: service_healthy
    networks:
    - backend
    restart: unless-stopped
  valkey:
    image: valkey/valkey:8.0-alpine3.22
    networks:
    - backend
    volumes:
    - valkey-volume:/data
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - valkey-cli
      - ping
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 3s
  kafka:
    image: confluentinc/cp-kafka:7.9.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://kafka:29093,INTERNAL://kafka:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: q1Sh-9_ISia_zwGINzRvyQ
    networks:
    - backend
    restart: unless-stopped
    # Host port publishing lives in the devcontainer override.
    healthcheck:
      test:
      - CMD
      - kafka-broker-api-versions
      - "--bootstrap-server"
      - localhost:9092
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  loki:
    image: grafana/loki:latest
    command: "-config.file=/etc/loki/local-config.yaml"
    volumes:
    - loki-volume:/tmp/loki
    networks:
    - observability
    restart: unless-stopped
  tempo:
    image: grafana/tempo:2.10.5
    command:
    - "-config.file=/etc/tempo.yaml"
    # Host port publishing lives in the devcontainer override.
    volumes:
    - "./docker/tempo/tempo.yaml:/etc/tempo.yaml:ro,z"
    - tempo-volume:/var/tempo
    networks:
    - observability
    restart: unless-stopped
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_PATHS_PROVISIONING: "/etc/grafana/provisioning"
    volumes:
    - grafana-volume:/var/lib/grafana
    - "./docker/grafana/provisioning:/etc/grafana/provisioning:z"
    networks:
    - observability
    depends_on:
    - loki
    - tempo
    - prometheus
    restart: unless-stopped
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
    - "./docker/otel-collector/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro,z"
    networks:
    - observability
    depends_on:
    - tempo
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:latest
    volumes:
    - "./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z"
    - prometheus-volume:/prometheus
    networks:
    - observability
    restart: unless-stopped
  pgadmin:
    image: dpage/pgadmin4
    # `user: root` lets the entrypoint chmod the bind-mounted pgpass to 0600
    # before pgAdmin de-escalates to the pgadmin user. Under rootless podman
    # "root" inside the container is the host user via userns mapping (not
    # real root), but the chmod still succeeds on the bind-mounted file
    # because the host user already owns it.
    user: root
    entrypoint:
    - "/bin/sh"
    - "-c"
    - "chmod 600 /pgpass && /entrypoint.sh"
    # Host port publishing lives in the devcontainer override.
    environment:
      PGADMIN_DEFAULT_EMAIL: root@example.com
      PGADMIN_DEFAULT_PASSWORD: password
      # Auto-import the pub/sub server definitions on first launch.
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
    - "./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro,z"
    - "./docker/pgadmin/pgpass:/pgpass:z"
    networks:
    - backend
    depends_on:
      primary:
        condition: service_healthy
      replica:
        condition: service_started
  tinyrdm:
    image: ghcr.io/tiny-craft/tiny-rdm:latest
    # Host port publishing lives in the devcontainer override.
    environment:
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change-me
    volumes:
    - tinyrdm-volume:/app/tinyrdm
    networks:
    - backend
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    depends_on:
    - core
    command: tunnel run --token ${CLOUDFLARED_TOKEN}
    environment:
      CLOUDFLARED_TOKEN: "${CLOUDFLARED_TOKEN}"
    networks:
    - frontend
    extra_hosts:
    - host.docker.internal:host-gateway
    restart: unless-stopped
networks:
  backend: {}
  frontend: {}
  observability: {}
  outer:
    name: "${OUTER_DOCKER_NETWORK:-umaxica-apps-global_outer}"
    external: "${OUTER_DOCKER_NETWORK_EXTERNAL:-false}"
volumes:
  valkey-volume: {}
  loki-volume: {}
  tempo-volume: {}
  grafana-volume: {}
  prometheus-volume: {}
  tinyrdm-volume: {}
  umaxica-home-cache: {}
  umaxica-home-share: {}
  umaxica-node-modules: {}
  umaxica-bundle: {}
