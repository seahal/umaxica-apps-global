---
name: umaxica-apps-global
services:
  core:
    build:
      context: "."
      dockerfile: "./Dockerfile"
      args:
        COMMIT_HASH: abcdef
        DOCKER_UID: "${UID:-1000}"
        DOCKER_GID: "${GID:-1000}"
    env_file: docker/core/env
    entrypoint:
    - "/bin/bash"
    - "/home/global/workspace/docker/core/entrypoint.sh"
    command:
    - sleep
    - infinity
    environment:
      POSTGRESQL_USER: "${POSTGRESQL_USER:-root}"
      POSTGRESQL_PASSWORD: "${POSTGRESQL_PASSWORD:-development_password}"
      POSTGRESQL_DATABASE: "${POSTGRESQL_DATABASE:-db}"
    restart: always
    user: "${UID:-1000}:${GID:-1000}"
    tmpfs:
    - "/home/global/workspace/tmp:uid=${UID:-1000},gid=${GID:-1000}"
    - "/home/global/workspace/log:uid=${UID:-1000},gid=${GID:-1000}"
    volumes:
    - type: bind
      source: "."
      target: "/home/global/workspace"
    ports:
    - "3001:3000"
    networks:
      backend: {}
      frontend:
        aliases:
        - id.app.localhost
        - id.com.localhost
        - id.org.localhost
      observability: {}
      outer:
        aliases:
        - global
    depends_on:
      primary:
        condition: service_healthy
      replica:
        condition: service_started
      valkey:
        condition: service_healthy
      otel-collector:
        condition: service_started
  primary:
    image: postgres:18.1-alpine
    command:
    - "-c"
    - config_file=/etc/postgresql/postgresql.conf
    - "-c"
    - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_USER: "${POSTGRESQL_USER:-root}"
      POSTGRES_PASSWORD: "${POSTGRESQL_PASSWORD:-development_password}"
      POSTGRES_DB: "${POSTGRESQL_DATABASE:-db}"
      POSTGRES_REPLICATION_USER: "${POSTGRESQL_REPLICATION_USER:-replicator}"
      POSTGRES_REPLICATION_PASSWORD: "${POSTGRESQL_REPLICATION_PASSWORD:-development_replication_password}"
      TZ: UTC
      POSTGRES_INITDB_WAL_LEVEL: replica
      POSTGRES_INITDB_MAX_WAL_SENDERS: 10
      POSTGRES_INITDB_MAX_REPLICATION_SLOTS: 10
    tmpfs:
    - "/var/lib/postgresql/18"
    volumes:
    - "./docker/psql-pub/postgresql.conf:/etc/postgresql/postgresql.conf:ro"
    - "./docker/psql-pub/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro"
    - "./docker/psql-pub:/docker-entrypoint-initdb.d:ro"
    networks:
    - backend
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
  replica:
    image: postgres:18.1-alpine
    entrypoint: "/entrypoint.sh"
    environment:
      POSTGRES_USER: "${POSTGRESQL_USER:-root}"
      POSTGRES_PASSWORD: "${POSTGRESQL_PASSWORD:-development_password}"
      POSTGRES_DB: "${POSTGRESQL_DATABASE:-db}"
      POSTGRES_REPLICATION_USER: "${POSTGRESQL_REPLICATION_USER:-replicator}"
      POSTGRES_REPLICATION_PASSWORD: "${POSTGRESQL_REPLICATION_PASSWORD:-development_replication_password}"
      TZ: UTC
    tmpfs:
    - "/var/lib/postgresql/18"
    volumes:
    - "./docker/psql-sub/entrypoint.sh:/entrypoint.sh:ro"
    - "./docker/psql-sub/postgresql.conf:/etc/postgresql/postgresql.conf:ro"
    - "./docker/psql-sub/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro"
    depends_on:
      primary:
        condition: service_healthy
    networks:
    - backend
    restart: unless-stopped
  valkey:
    image: valkey/valkey:8.0-alpine3.22
    networks:
    - backend
    volumes:
    - valkey-volume:/data
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - valkey-cli
      - ping
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 3s
  kafka:
    image: confluentinc/cp-kafka:7.9.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://kafka:29093,INTERNAL://kafka:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: q1Sh-9_ISia_zwGINzRvyQ
    networks:
    - backend
    restart: unless-stopped
    ports:
    - "9092:9092"
    healthcheck:
      test:
      - CMD
      - kafka-broker-api-versions
      - "--bootstrap-server"
      - localhost:9092
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  loki:
    image: grafana/loki:latest
    command: "-config.file=/etc/loki/local-config.yaml"
    volumes:
    - loki-volume:/tmp/loki
    networks:
    - observability
    restart: unless-stopped
  tempo:
    image: grafana/tempo:latest
    command: "-config.file=/etc/tempo.yaml"
    ports:
    - "3200:3200"
    - "4317:4317"
    - "4318:4318"
    - "9411:9411"
    volumes:
    - "./docker/tempo/tempo.yaml:/etc/tempo.yaml:ro"
    - tempo-volume:/var/tempo/traces
    networks:
    - observability
    restart: unless-stopped
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_PATHS_PROVISIONING: "/etc/grafana/provisioning"
    volumes:
    - grafana-volume:/var/lib/grafana
    - "./docker/grafana/provisioning:/etc/grafana/provisioning"
    networks:
    - observability
    depends_on:
    - loki
    - tempo
    - prometheus
    restart: unless-stopped
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
    - "./docker/otel-collector/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro"
    networks:
    - observability
    depends_on:
    - tempo
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:latest
    volumes:
    - "./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
    - prometheus-volume:/prometheus
    networks:
    - observability
    restart: unless-stopped
  alloy:
    image: grafana/alloy:latest
    volumes:
    - "./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro"
    - "/var/run/docker.sock:/var/run/docker.sock:ro"
    command: run /etc/alloy/config.alloy
    networks:
    - observability
    depends_on:
    - loki
    restart: unless-stopped
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    depends_on:
    - core
    command: tunnel run --token ${CLOUDFLARED_TOKEN}
    environment:
      CLOUDFLARED_TOKEN: "${CLOUDFLARED_TOKEN}"
    networks:
    - frontend
    extra_hosts:
    - host.docker.internal:host-gateway
    restart: unless-stopped
networks:
  backend: {}
  frontend: {}
  observability: {}
  outer:
    name: "${OUTER_DOCKER_NETWORK:-umaxica-apps-global_outer}"
    external: "${OUTER_DOCKER_NETWORK_EXTERNAL:-false}"
volumes:
  valkey-volume: {}
  loki-volume: {}
  tempo-volume: {}
  grafana-volume: {}
  prometheus-volume: {}
