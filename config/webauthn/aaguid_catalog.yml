# AAGUID -> friendly-name catalog for passkey providers and security keys.
#
# Display-only: registration uses attestation "none", so the AAGUID is
# self-reported by the client and must never feed security decisions or
# duplicate detection (an AAGUID identifies a product line, not an
# authenticator instance). Unknown or zeroed AAGUIDs are expected and never
# fail a ceremony.
#
# Source: FIDO Alliance Metadata Service descriptions and the
# community-maintained passkey-authenticator-aaguids list. Update by adding
# entries here; keys must be lowercase canonical UUID form.
