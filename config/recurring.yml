#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

development:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Delete expired DPoP proof-state / nonce rows (TTL 300s, not covered by
  # RetentionPurgeJob which keys on purged_at).
  dpop_proof_state_purge:
    class: DpopProofStatePurgeJob
    schedule: every 15 minutes

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Clean up expired records with purgeable timestamps.
  retention_purge:
    class: RetentionPurgeJob
    schedule: every 15 minutes

  # Delete expired DPoP proof-state / nonce rows (TTL 300s, not covered by
  # RetentionPurgeJob which keys on purged_at).
  dpop_proof_state_purge:
    class: DpopProofStatePurgeJob
    schedule: every 15 minutes
