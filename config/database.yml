<%
  default_host = ENV.fetch("POSTGRESQL_HOST", "localhost")
  test_host = ENV.fetch("POSTGRESQL_TEST_HOST", default_host)
%>
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 32 } %>
  port: 5432
  timeout: 30000
  username: <%= ENV.fetch("POSTGRESQL_USER", "postgres") %>
  password: <%= ENV["POSTGRESQL_PASSWORD"]
    .presence || Rails.application.credentials.dig(:DATABASE, :PASSWORD) %>
  lock_timeout: 2s
  # Raised from 2s so background jobs (e.g. RetentionPurgeJob batch deletes) are not
  # killed mid-statement. Web requests are additionally bounded by rack-timeout (10s).
  statement_timeout: 15s
  advisory_locks: false
test_default: &test_default
  !!merge <<: *default
  timeout: 20000
  prepared_statements: false
  advisory_locks: true
  lock_timeout: 2s
  statement_timeout: 10s
  variables:
    max_parallel_workers: 0
    max_parallel_workers_per_gather: 0
    max_parallel_maintenance_workers: 0
    jit: off
