name: umaxica-apps-global-dc
services:
  core:
    container_name: global-devcontainer-core
    # Host-shaped build args. The base compose intentionally omits them so the
    # service contract does not embed the developer-machine UID/GID.
    build:
      args:
        DOCKER_UID: "${UID:-1000}"
        DOCKER_GID: "${GID:-1000}"
    userns_mode: keep-id
    # No service needs a real root control-plane PID 1 inside the container.
    # `keep-id` maps the host user directly to the workload UID/GID baked into
    # the image (DOCKER_UID/DOCKER_GID above), so bind-mounted repo files keep
    # host ownership. Clear the base compose file's `user: root`: rootless
    # Podman's keep-id handling silently overrides an explicit `user:`
    # anyway, and core-entrypoint now runs the workload directly (no chown,
    # no setpriv drop) when it's already started as the keep-id-mapped
    # workload UID.
    user: !reset null
    tty: true
    stdin_open: true
    # Workspace bind mount lives in the override. `:Z` adds an SELinux private
    # label on Fedora/RHEL hosts; harmless on non-SELinux hosts (Arch, Ubuntu).
    # Relative paths in compose files resolve against the project directory
    # (the dir holding the first -f file), so `.` is the repo root.
    volumes:
      - type: bind
        source: "."
        target: "/home/global/workspace"
        bind:
          selinux: Z
      # The Dev Container string-form `readonly` mounts are writable with the
      # current rootless Podman provider. Keep host configuration and guarded
      # workspace paths in Compose long syntax so Gate C can inspect the
      # effective mount flags. The host SSH directory is intentionally absent:
      # inbound Remote Codex does not need host private keys.
      # Host timezone. /etc/timezone is a Debian/Ubuntu file and does not
      # exist on Fedora/RHEL or Arch, where Podman refuses to start the
      # container at all ("statfs /etc/timezone: no such file or directory")
      # rather than inventing an empty source. /etc/localtime exists on every
      # one of them, carries the same information, and needs no `selinux:`
      # option because its label (locale_t) is already readable by container_t
      # -- unlike the workspace mounts below, and unlike a relabel of a host
      # /etc file, which must never be done.
      - type: bind
        source: "/etc/localtime"
        target: "/etc/localtime"
        read_only: true
      - type: bind
        source: "./.github"
        target: "/home/global/workspace/.github"
        read_only: true
        bind:
          selinux: Z
      - type: bind
        source: "./bin"
        target: "/home/global/workspace/bin"
        read_only: true
        bind:
          selinux: Z
      - type: bind
        source: "./.devcontainer"
        target: "/home/global/workspace/.devcontainer"
        read_only: true
        bind:
          selinux: Z
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3036:3036"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TMPDIR=/home/global/workspace/tmp
      - DEVCONTAINER=1
      - RUBY_DEBUG_OPEN=false
  rustfs:
    ports:
      - "127.0.0.1:${RUSTFS_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_HOST_PORT:-9001}:9001"
  primary:
    container_name: global-devcontainer-primary
  replica:
    container_name: global-devcontainer-replica
  valkey:
    container_name: global-devcontainer-valkey
  # kafka needs no devcontainer override: it publishes no host port and its
  # container name is not referenced by tooling.
  loki:
    container_name: global-devcontainer-loki
  tempo:
    container_name: global-devcontainer-tempo
  grafana:
    container_name: global-devcontainer-grafana
  # cloudflare-tunnel is defined in compose.custom.yaml (repo root); see
  # docs/operations/cloudflare-private-origin.md.
