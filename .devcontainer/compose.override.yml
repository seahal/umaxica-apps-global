---
# Compatibility overlay for callers that still load this tracked file explicitly.
# The Rails core service belongs to .devcontainer/compose.yaml now.
# Must match `compose.yaml`'s `name:` exactly, separators included -- see the
# comment there for why the Dev Containers CLI forces the unseparated form.
name: umaxicaappsglobaldc
services:
  primary:
    container_name: global-devcontainer-primary
  replica:
    container_name: global-devcontainer-replica
  valkey-cache:
    container_name: global-devcontainer-valkey-cache
  valkey-rate-limit:
    container_name: global-devcontainer-valkey-rate-limit
  loki:
    container_name: global-devcontainer-loki
  tempo:
    container_name: global-devcontainer-tempo
  grafana:
    container_name: global-devcontainer-grafana
