allowBuilds:
  lefthook: true
  puppeteer: false
minimumReleaseAge: 4320
minimumReleaseAgeIgnoreMissingTime: false
registries:
  default: https://registry.npmjs.org/
strictDepBuilds: true
trustPolicy: no-downgrade
unicode: false
overrides:
  vitest: "catalog:"
  vite: "catalog:"
catalog:
  "@types/node": 24.13.3
  vite: 8.2.0
  vitest: 4.1.10
  "@vitest/coverage-v8": 4.1.10
  lefthook: 2.1.10
  oxfmt: 0.62.0
  oxlint: 1.77.0
  oxlint-tsgolint: 7.0.2001
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
