allowBuilds:
  lefthook: true
  puppeteer: false
minimumReleaseAge: 4320
minimumReleaseAgeIgnoreMissingTime: false
registries:
  default: https://registry.npmjs.org/
strictDepBuilds: true
trustPolicy: no-downgrade
unicode: false
overrides:
  vitest: "catalog:"
  vite: "catalog:"
catalog:
  "@types/node": 26.1.0
  vite: 8.0.16
  vitest: 4.1.9
  "@vitest/coverage-v8": 4.1.9
  lefthook: 2.1.10
  oxfmt: 0.57.0
  oxlint: 1.72.0
  oxlint-tsgolint: 0.24.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  - lefthook
  - "lefthook-*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
