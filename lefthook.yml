pre-commit:
  parallel: true
  jobs:
    - name: oxfmt
      glob:
        - "*.{js,jsx,ts,tsx,json,jsonc,css,scss,md,yml,yaml}"
      exclude:
        # ERB-templated Rails config; oxfmt's YAML parser cannot handle the
        # embedded <% %> tags and misreads them as YAML syntax errors.
        - "config/database.yml"
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true

    - name: oxlint
      glob:
        - "*.{js,jsx,ts,tsx}"
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true

    - name: rubocop
      glob:
        - "*.{rb,rake}"
      run: bundle exec rubocop -a --force-exclusion {staged_files}
      stage_fixed: true

pre-push:
  parallel: false
  jobs:
    - name: frontend-check
      run: pnpm -s run ci
