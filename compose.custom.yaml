name: umaxica-apps-global-dc
# Always-on overlay: unconditionally referenced by .devcontainer/devcontainer.json's
# dockerComposeFile array, and merged manually with `-f compose.custom.yaml` for
# non-devcontainer `podman compose` invocations. None of the services below carry a
# `profiles:` key -- this file's presence in the merge is itself the opt-in, so a plain
# `devcontainer up` (or `podman compose -f compose.yaml -f .devcontainer/compose.override.yml
# -f compose.custom.yaml up`) starts all of them with no extra flags.
#
# No credential is resolved from the host. The connector token that used to come
# from the repository `.env` was retired along with every other long-lived
# credential: cloudflared now authenticates with `cloudflared tunnel login`,
# performed in a browser from inside the container, and Tailscale with an
# interactive `tailscale up`. Both write into tmpfs, so the credential dies with
# the container and nothing is ever staged on the host.
services:
  cloudflare-tunnel:
    # Workers VPC requires cloudflared 2025.7.0 or newer.
    image: docker.io/cloudflare/cloudflared:2025.7.0
    depends_on:
      - core
    # Workers VPC DNS routing requires QUIC and outbound UDP 7844.
    # No `run <name>` argument and no TUNNEL_TOKEN: the connector reads the
    # credentials that `cloudflared tunnel login` wrote into /home/nonroot/.cloudflared.
    # Run the login once per container:
    #   podman compose exec cloudflare-tunnel cloudflared tunnel login
    # then restart this service. The directory is tmpfs, so recreating the
    # container requires logging in again -- that is intentional.
    command: tunnel --protocol quic run
    tmpfs:
      - /home/nonroot/.cloudflared:mode=0700,uid=65532,gid=65532
    # This list replaces, rather than merges with, any `networks:` the base file gives the
    # service, so `frontend` must stay written out here. Dropping it would strip the private
    # `*.localhost` Rails origins from the connector and break every working ingress rule.
    networks:
      - frontend
      - edge-tunnel
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
  core:
    # Tailscale is not in use right now. tailscale-core-supervisor needs a
    # real root control-plane PID 1 (see .devcontainer/compose.override.yml),
    # which conflicts with `userns_mode: keep-id` there. Falling back to the
    # base compose.yaml `command: [sleep, infinity]` (by not overriding it
    # here) lets core-entrypoint idle as the keep-id-mapped user.
    # Re-enable by restoring this override and reverting the override file.
    environment:
      # Optional exact Rails Host Authorization entry for Tailscale Serve.
      # The value is a hostname, not a credential; unset keeps normal startup
      # independent from Tailscale.
      TAILSCALE_SERVE_HOST: "${TAILSCALE_SERVE_HOST:-}"
    # Tailscale identity is no longer persisted. `tailscale up` is an interactive
    # browser login and its state lives in tmpfs, so it is discarded with the
    # container instead of surviving as a long-lived machine credential.
    tmpfs:
      - /var/lib/tailscale-core:mode=0700
networks:
  # Created and owned by the Edge compose project (umaxica-apps-edge-dc), which is where the
  # Next.js Core origin runs. Declared external so this project attaches to that network instead
  # of creating a second one of the same purpose; cross-project reachability is the only way
  # cloudflared can resolve the Edge origin at all. The Edge stack must therefore be running
  # before `cloudflare-tunnel` is created -- podman fails the `up` loudly when the network is
  # absent, which is the intended behaviour rather than a silent fallback to a connector that
  # can only reach Rails. Attaching here grants no new path to Rails: Rails stays on `frontend`.
  edge-tunnel:
    external: true
    name: umaxica-edge-tunnel
