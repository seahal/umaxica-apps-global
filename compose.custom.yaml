name: umaxica-apps-global-dc
# Always-on overlay: unconditionally referenced by .devcontainer/devcontainer.json's
# dockerComposeFile array, and merged manually with `-f compose.custom.yaml` for
# non-devcontainer `podman compose` invocations. Presence in the merge is the opt-in: a
# standard `devcontainer up` starts the connector and fails at Compose resolution when its
# tunnel token is not configured.
#
# The remotely managed tunnel token comes from the repository-local, gitignored `.env`.
# It is passed only to the cloudflared process and is never copied into an image, workspace
# file, command argument, or host bind mount. Tailscale remains independent and uses an
# interactive `tailscale up`.
services:
  cloudflare-tunnel:
    # Cloudflare supports cloudflared releases for one year. Keep this explicit tag current;
    # Workers VPC additionally requires 2025.7.0 or newer.
    image: docker.io/cloudflare/cloudflared:2026.8.2
    depends_on:
      - core
    # Workers VPC DNS routing requires QUIC and outbound UDP 7844.
    # TUNNEL_TOKEN identifies and authenticates the remotely managed tunnel, so no tunnel
    # name, cert.pem, credentials JSON, or browser-login helper is needed in this project.
    #
    # --metrics serves cloudflared's own /ready endpoint to the compose network so that
    # `bin/tunnel-origin-check` can tell a connected tunnel apart from a restarting one.
    # It publishes no host port.
    command: tunnel --protocol quic --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARED_TOKEN:?CLOUDFLARED_TOKEN must be set in .env}"
    # This list replaces, rather than merges with, any `networks:` the base file gives the
    # service, so `frontend` must stay written out here. Dropping it would strip the private
    # `*.localhost` Rails origins from the connector and break every working ingress rule.
    networks:
      - frontend
    # A connector that cannot identify its tunnel exits within milliseconds. Podman applies
    # no backoff to `unless-stopped`, so that turns into an unbounded restart storm which
    # saturates a CPU with netns, veth, conmon, and journald churn until someone notices.
    # Three attempts ride out a transient edge failure and keep a misconfiguration a
    # bounded, visible incident instead.
    restart: on-failure:3
    # Caps what a crash loop can consume before a human notices it.
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    # journald enforces no per-container size cap, so a crash loop writing to it degrades
    # the whole host journal. Keep connector output in a bounded ring instead.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  core:
    # Tailscale is not in use right now. tailscale-core-supervisor needs a
    # real root control-plane PID 1 (see .devcontainer/compose.override.yml),
    # which conflicts with `userns_mode: keep-id` there. Falling back to the
    # base compose.yaml `command: [sleep, infinity]` (by not overriding it
    # here) lets core-entrypoint idle as the keep-id-mapped user.
    # Re-enable by restoring this override and reverting the override file.
    environment:
      # Optional exact Rails Host Authorization entry for Tailscale Serve.
      # The value is a hostname, not a credential; unset keeps normal startup
      # independent from Tailscale.
      TAILSCALE_SERVE_HOST: "${TAILSCALE_SERVE_HOST:-}"
    # Tailscale identity is no longer persisted. `tailscale up` is an interactive
    # browser login and its state lives in tmpfs, so it is discarded with the
    # container instead of surviving as a long-lived machine credential.
    tmpfs:
      - /var/lib/tailscale-core:mode=0700
