name: umaxica-apps-global-dc
# Always-on overlay: unconditionally referenced by .devcontainer/devcontainer.json's
# dockerComposeFile array, and merged manually with `-f compose.custom.yaml` for
# non-devcontainer `podman compose` invocations. None of the services below carry a
# `profiles:` key -- this file's presence in the merge is itself the opt-in, so a plain
# `devcontainer up` (or `podman compose -f compose.yaml -f .devcontainer/compose.override.yml
# -f compose.custom.yaml up`) starts all of them with no extra flags. Starting
# cloudflare-tunnel requires its token at Compose resolution time. Direct-core
# Tailscale uses persisted interactive-login state instead of a Compose secret.
services:
  cloudflare-tunnel:
    # Workers VPC requires cloudflared 2025.7.0 or newer.
    image: cloudflare/cloudflared:2025.7.0
    depends_on:
      - core
    # Workers VPC DNS routing requires QUIC and outbound UDP 7844.
    command: tunnel --protocol quic run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARED_TOKEN:?CLOUDFLARED_TOKEN must be set in .env}"
    networks:
      - frontend
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
  core:
    # Tailscale is not in use right now. tailscale-core-supervisor needs a
    # real root control-plane PID 1 (see .devcontainer/compose.override.yml),
    # which conflicts with `userns_mode: keep-id` there. Falling back to the
    # base compose.yaml `command: [sleep, infinity]` (by not overriding it
    # here) lets core-entrypoint idle as the keep-id-mapped user.
    # Re-enable by restoring this override and reverting the override file.
    environment:
      # Optional exact Rails Host Authorization entry for Tailscale Serve.
      # The value is a hostname, not a credential; unset keeps normal startup
      # independent from Tailscale.
      TAILSCALE_SERVE_HOST: "${TAILSCALE_SERVE_HOST:-}"
    volumes:
      - type: volume
        source: tailscale-core-state
        target: /var/lib/tailscale-core
volumes:
  # Persistent identity for direct-core Tailscale SSH and HTTPS Serve.
  tailscale-core-state: {}
