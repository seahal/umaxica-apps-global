# The developer-owned overlay, and the only overlay. `compose.yaml` holds everything
# that is project-common; anything specific to one machine or one person's setup
# belongs here. `.devcontainer/devcontainer.json` loads the two files in order, and
# non-devcontainer runs merge them the same way:
#
#   podman compose -f compose.yaml -f compose.custom.yaml up -d core
#
# The file is committed, so it is always in the merge and its presence is the opt-in:
# a standard `devcontainer up` starts the connector and fails at Compose resolution
# when its tunnel token is not configured.
#
# Host devices belong here too. The `workspace` build target
# (CORE_BUILD_TARGET=workspace in `.env`) additionally needs
# `devices: ["/dev/fuse:/dev/fuse"]` on `core`; it is absent because not every host
# exposes `/dev/fuse`, and a missing device makes the whole project fail to start.
# See docs/operations/development-container-targets.md.
#
# The remotely managed tunnel token comes from the repository-local, gitignored `.env`.
# It is passed only to the cloudflared process and is never copied into an image, workspace
# file, command argument, or host bind mount.
services:
  cloudflare-tunnel:
    # Cloudflare supports cloudflared releases for one year. Keep this explicit tag current;
    # Workers VPC additionally requires 2025.7.0 or newer.
    image: docker.io/cloudflare/cloudflared:2026.8.2
    depends_on:
      - core
    # Workers VPC DNS routing requires QUIC and outbound UDP 7844.
    # TUNNEL_TOKEN identifies and authenticates the remotely managed tunnel, so no tunnel
    # name, cert.pem, credentials JSON, or browser-login helper is needed in this project.
    #
    # --metrics serves cloudflared's own /ready endpoint to the compose network so that
    # `bin/tunnel-origin-check` can tell a connected tunnel apart from a restarting one.
    # It publishes no host port.
    command: tunnel --protocol quic --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARED_TOKEN:?CLOUDFLARED_TOKEN must be set in .env}"
    # This list replaces, rather than merges with, any `networks:` the base file gives the
    # service, so `frontend` must stay written out here. Dropping it would strip the private
    # `*.localhost` Rails origins from the connector and break every working ingress rule.
    networks:
      - frontend
    # A connector that cannot identify its tunnel exits within milliseconds. Podman applies
    # no backoff to `unless-stopped`, so that turns into an unbounded restart storm which
    # saturates a CPU with netns, veth, conmon, and journald churn until someone notices.
    # Three attempts ride out a transient edge failure and keep a misconfiguration a
    # bounded, visible incident instead.
    restart: on-failure:3
    # Caps what a crash loop can consume before a human notices it.
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    # journald enforces no per-container size cap, so a crash loop writing to it degrades
    # the whole host journal. Keep connector output in a bounded ring instead.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Remote access: Codex App -> SSH over Tailscale -> core ---------------
  #
  #   Codex App --(tailnet TCP/22)--> tailscale-core --(core:2222)--> core sshd
  #
  # See docs/operations/remote-codex-over-tailscale.md. Two earlier attempts are
  # worth knowing about: an in-`core` Tailscale needed a real root PID 1, which
  # `userns_mode: keep-id` and the absent `user:` key make impossible, so the
  # daemon lives in its own sidecar here and `core` carries only OpenSSH.
  core:
    # Starts the opt-in sshd block in podman/core/entrypoint.sh. `core` is not
    # profile-gated, so this must default to off: a developer who has not set up
    # remote access still gets a working container. Turn it on by setting both
    # REMOTE_SSHD=1 and COMPOSE_PROFILES=remote in `.env`. Once on, the entrypoint
    # fails loudly if the key file below is missing or empty, so a half-configured
    # remote path is a visible error rather than an unreachable container.
    environment:
      REMOTE_SSHD: "${REMOTE_SSHD:-0}"
    volumes:
      # The Codex App's PUBLIC key. `.secrets/` is gitignored and excluded from
      # both build contexts, so the key never enters an image layer. Read-only and
      # outside the workspace: nothing a development shell can write may grant
      # itself new access. A public key is not a credential, so this does not
      # breach the "no host credential in core" charter in devcontainer.json.
      #
      # bin/setup-dev-secrets creates this file empty if it is absent, because a
      # bind mount whose source does not exist makes Podman invent a DIRECTORY
      # there and every `up` then fails. Empty is harmless while REMOTE_SSHD=0.
      - type: bind
        source: "./.secrets/codex_authorized_keys"
        target: "/home/global/.config/umaxica/authorized_keys"
        read_only: true
        bind:
          selinux: Z
      # sshd host key. Persisted so the client's known_hosts entry survives
      # container recreation; generated at first start, never baked into an image.
      - type: volume
        source: umaxica-sshd-hostkey
        target: "/home/global/.local/state/umaxica-sshd"
    # A service-level `networks:` key in an overlay REPLACES the base list rather
    # than merging with it, and `core`'s base entry carries ~50 `frontend` aliases
    # that every Cloudflare Tunnel ingress rule resolves against. All five networks
    # must therefore stay written out here. The aliases themselves do merge, so
    # they are not repeated.
    networks:
      backend: {}
      frontend: {}
      observability: {}
      outer: {}
      remote-access: {}
  tailscale-core:
    # Tailnet ingress for the Codex App. Joins the tailnet in userspace mode and
    # TCP-forwards tailnet port 22 to core:2222. SSH terminates at the OpenSSH
    # server inside `core`, never here: Tailscale SSH is deliberately NOT enabled,
    # because logging into this sidecar's shell is not the point -- the Codex App
    # needs core's filesystem and toolchain.
    #
    # Pinned to the release running on the host daemon. Keep the two in step.
    image: docker.io/tailscale/tailscale:v1.102.3
    # Explicitly opt-in. Without COMPOSE_PROFILES=remote in .env, a plain
    # `podman compose up` never creates, starts, or pulls this service.
    profiles:
      - remote
    environment:
      # Userspace netstack terminates the tailnet TCP connection inside tailscaled
      # and dials `core` as an ordinary socket. This is the security boundary and
      # the reason no capability, /dev/net/tun device, or privileged mode appears
      # below. It is the image default, but it is stated so a future edit has to
      # remove it deliberately. Tailscale's own Docker example pairs NET_ADMIN and
      # NET_RAW with userspace mode; that is over-provisioned -- do not copy it.
      TS_USERSPACE: "true"
      # The image default is false, which re-runs `tailscale up` with the auth key
      # on EVERY start -- a one-off key then fails on the second boot. `true` means
      # persisted state alone is enough once the node has registered.
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_HOSTNAME: umaxica-global-core
      # Must stay off. It would replace the container's DNS with the tailnet's, and
      # the sidecar would no longer resolve the sibling service name `core`.
      TS_ACCEPT_DNS: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      # Tagged nodes are exempt from user key expiry, which is what a long-lived
      # development container needs. Scope tailnet reach with an ACL grant on this
      # tag rather than with a broad user rule.
      TS_EXTRA_ARGS: "--advertise-tags=tag:umaxica-core"
      TS_SERVE_CONFIG: /etc/tailscale/serve/serve.json
      # Bootstrap only. Blank it in `.env` and revoke the key in the admin console
      # once the node has registered into the state volume below; TS_AUTH_ONCE
      # above means restarts no longer need it. Never commit a value here.
      TS_AUTHKEY: "${TS_AUTHKEY:-}"
    volumes:
      # Tailscale node identity. Surviving recreation is the whole point: without
      # it every restart registers a NEW node and the tailnet name drifts to
      # umaxica-global-core-1, -2, ... Deleting this volume deregisters the node.
      - type: volume
        source: tailscale-core-state
        target: /var/lib/tailscale
      # The containing DIRECTORY, not the file: Tailscale watches the path for
      # changes and an editor that replaces the inode would otherwise go unnoticed.
      - "./podman/tailscale/serve:/etc/tailscale/serve:ro,z"
    # Only the sidecar-to-core path. Deliberately not on `frontend` or `backend`:
    # a tailnet-facing container has no business resolving PostgreSQL or Valkey.
    networks:
      - remote-access
    # No `ports:`. The tailnet is the ingress; publishing anything to the host
    # would defeat the point and violate the loopback-only contract
    # (docs/operations/development-host-port-exposure.md).
    #
    # Bounded like the tunnel connector: Podman applies no backoff to
    # `unless-stopped`, so a misconfiguration would become a restart storm.
    restart: on-failure:3
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  # The sidecar's only network, carrying both the forwarded SSH hop to core:2222
  # and the sidecar's own control-plane/DERP egress. Deliberately a plain bridge:
  # `internal: true` would block that egress and force the sidecar onto a shared
  # network instead, which would widen exposure rather than narrow it.
  remote-access: {}
volumes:
  # Tailscale node identity; see the sidecar's state mount above.
  tailscale-core-state: {}
  # sshd host key for core's opt-in remote-access path.
  umaxica-sshd-hostkey: {}
