# The developer-owned overlay, and the only overlay. `compose.yaml` holds everything
# that is project-common; anything specific to one machine or one person's setup
# belongs here. `.devcontainer/devcontainer.json` loads the two files in order, and
# non-devcontainer runs merge them the same way:
#
#   podman compose -f compose.yaml -f compose.custom.yaml up -d core
#
# The file is committed, so it is always in the merge and its presence is the opt-in:
# a standard `devcontainer up` starts the connector and fails at Compose resolution
# when its tunnel token is not configured.
#
# Host devices belong here too. The `workspace` build target
# (CORE_BUILD_TARGET=workspace in `.env`) additionally needs
# `devices: ["/dev/fuse:/dev/fuse"]` on `core`; it is absent because not every host
# exposes `/dev/fuse`, and a missing device makes the whole project fail to start.
# See docs/operations/development-container-targets.md.
#
# The remotely managed tunnel token comes from the repository-local, gitignored `.env`.
# It is passed only to the cloudflared process and is never copied into an image, workspace
# file, command argument, or host bind mount.
services:
  cloudflare-tunnel:
    # Cloudflare supports cloudflared releases for one year. Keep this explicit tag current;
    # Workers VPC additionally requires 2025.7.0 or newer.
    image: docker.io/cloudflare/cloudflared:2026.8.2
    depends_on:
      - core
    # Workers VPC DNS routing requires QUIC and outbound UDP 7844.
    # TUNNEL_TOKEN identifies and authenticates the remotely managed tunnel, so no tunnel
    # name, cert.pem, credentials JSON, or browser-login helper is needed in this project.
    #
    # --metrics serves cloudflared's own /ready endpoint to the compose network so that
    # `bin/tunnel-origin-check` can tell a connected tunnel apart from a restarting one.
    # It publishes no host port.
    command: tunnel --protocol quic --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARED_TOKEN:?CLOUDFLARED_TOKEN must be set in .env}"
    # This list replaces, rather than merges with, any `networks:` the base file gives the
    # service, so `frontend` must stay written out here. Dropping it would strip the private
    # `*.localhost` Rails origins from the connector and break every working ingress rule.
    networks:
      - frontend
    # A connector that cannot identify its tunnel exits within milliseconds. Podman applies
    # no backoff to `unless-stopped`, so that turns into an unbounded restart storm which
    # saturates a CPU with netns, veth, conmon, and journald churn until someone notices.
    # Three attempts ride out a transient edge failure and keep a misconfiguration a
    # bounded, visible incident instead.
    restart: on-failure:3
    # Caps what a crash loop can consume before a human notices it.
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    # journald enforces no per-container size cap, so a crash loop writing to it degrades
    # the whole host journal. Keep connector output in a bounded ring instead.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  # Host GitHub authentication, forwarded rather than copied. No private key, no
  # ~/.ssh directory, and no token literal enters this file or the image: the two
  # mounts below carry a socket and a public host-key database, and GH_TOKEN is
  # read from the environment that launches Compose.
  #
  # This is the developer-owned overlay, so both values are host-shaped by
  # definition and cannot live in compose.yaml.
  core:
    # Pinned here as well as in .devcontainer/compose.override.yml. The `:Z` mounts
    # below relabel two host paths to container_file_t at this container's MCS
    # level. The devcontainer path loads the override and pins s0:c101,c202; the
    # documented CLI path (`podman compose -f compose.yaml -f compose.custom.yaml
    # up -d core`) does not, so without this line each CLI run would allocate a
    # fresh category pair, restamp the host's known_hosts and agent socket, and
    # lock the other path out of them.
    security_opt:
      - label=level:s0:c101,c202
    environment:
      # A container-internal path naming the bind mount below, not a host path.
      SSH_AUTH_SOCK: /ssh-agent
      # gh prefers a non-empty GH_TOKEN over ~/.config/gh/hosts.yml, so a stale
      # token left in the container's gh config cannot win and `gh auth login` is
      # never needed. Empty when the host exports none, which gh reads as unset.
      # It also reaches git: /home/global/.gitconfig already routes
      # https://github.com through `gh auth git-credential`.
      GH_TOKEN: "${GH_TOKEN:-}"
    volumes:
      # The host agent's socket. Signing happens in the host ssh-agent; the key
      # itself never crosses the boundary. Prefer a stable socket path on the host
      # (`systemctl --user enable --now ssh-agent.socket`): a per-login
      # /tmp/ssh-XXXX/agent.N path changes every login and forces a recreate.
      #
      # The placeholder default keeps `up` working on a host with no agent -- Podman
      # creates that path as an empty directory and ssh then reports a plain
      # "Error connecting to agent" instead of failing Compose resolution on an
      # empty bind source.
      - type: bind
        source: "${SSH_AUTH_SOCK:-/tmp/ssh-agent-not-forwarded}"
        target: /ssh-agent
        bind:
          selinux: Z
      # Read-only, and only this one file -- never the ~/.ssh directory, which holds
      # the private keys. Without it ssh cannot verify github.com's host key and
      # refuses the connection.
      #
      # `:Z` relabels the host's known_hosts to container_file_t; a normal RHEL
      # login user is unconfined_u and keeps reading it. The file must already exist
      # on the host: Podman creates a missing bind source as a *directory*, which
      # would break host ssh. `ssh -T git@github.com` on the host before the first
      # `up` both proves the agent works and guarantees the file is there.
      - type: bind
        source: "${HOME}/.ssh/known_hosts"
        target: /home/global/.ssh/known_hosts
        read_only: true
        bind:
          selinux: Z
