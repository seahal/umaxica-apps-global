# Disposable Compose overlay for the PostgreSQL <-> S3 FDW proof of concept.
#
# NOT part of the base compose.yaml — pass this file explicitly with an extra `-f`
# flag so the PoC is opt-in and fully removable without touching any other Compose
# definition. See docs/experiments/postgres-s3-fdw-poc.md for the full runbook and
# the exact cleanup manifest (Gate 2c).
#
# Usage (from the repository root, alongside the normal Compose invocation):
#   podman compose -f compose.yaml -f docker/fdw-poc/compose.fdw-poc.yml \
#     --profile object-storage --profile fdw-poc up -d rustfs-permissions rustfs fdw-poc
#
# Requires FDW_POC_POSTGRES_PASSWORD to be set in the host shell or an env file;
# there is no default and no fallback, so misconfiguration fails loudly.

services:
  fdw-poc:
    build:
      context: ../../docker/fdw-poc
      dockerfile: Containerfile
    profiles:
      - fdw-poc
    environment:
      POSTGRES_DB: fdw_poc
      POSTGRES_USER: fdw_poc
      POSTGRES_PASSWORD: "${FDW_POC_POSTGRES_PASSWORD:?FDW_POC_POSTGRES_PASSWORD must be set}"
    volumes:
      - fdw-poc-data:/var/lib/postgresql/data
    depends_on:
      rustfs:
        condition: service_healthy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # Disposable, pinned S3 client used only for bucket creation and independent
  # post-write verification against RustFS. Never given host ports; invoked only via
  # `podman compose ... run --rm fdw-poc-awscli <args>`. Credentials are passed at
  # invocation time (`-e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY`, sourced from the
  # invoking shell's environment) and are never baked into this file. Keeping this
  # container on the host means the Linux host itself never needs an `aws` CLI install.
  fdw-poc-awscli:
    image: public.ecr.aws/aws-cli/aws-cli:2.31.16
    profiles:
      - fdw-poc
    entrypoint: ["aws"]
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    restart: "no"

volumes:
  fdw-poc-data: {}
