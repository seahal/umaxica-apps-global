openapi: 3.2.0
info:
  title: Umaxica JSON API
  description: |
    Machine-facing JSON endpoints served under `/api/v0`, plus the internal health probes.

    Errors use RFC 9457 Problem Details (`application/problem+json`). Problem `type` values are the
    stable identifiers clients branch on; `title` and `detail` are human-readable and may change.

    Endpoints whose wire format is fixed by another specification -- OAuth 2.0, OIDC, WebAuthn,
    DBSC, MCP (JSON-RPC 2.0), and `.well-known` resources -- are intentionally absent from this
    description. They are governed by their own specifications, not by this contract.

    The `app`, `com`, and `org` surfaces are independent trust boundaries served on separate hosts.
    An endpoint documented here exists on each surface's own host; it is never shared across them.
  version: "0"
  contact:
    name: API Support

servers:
  - url: https://{host}
    description: Surface host. The concrete value is deployment configuration.
    variables:
      host:
        default: jp.umaxica.app
        description: >-
          Canonical Core public host for the app surface. The com and org surfaces use
          jp.umaxica.com and jp.umaxica.org. Content surfaces are served from their own
          subdomains (for example docs.jp.umaxica.app).

tags:
  - name: Health
    description: Internal liveness, readiness, and startup probes. Blocked at the edge.
  - name: Session
    description: Core browser BFF session and token lifecycle, authenticated by first-party cookie.
  - name: Profile
    description: Native bearer-token resource endpoints.
  - name: Content
    description: Read-only published documentation, help, news, and info entries.

paths:
  /health:
    get:
      summary: Aggregate health snapshot
      description: >-
        Returns the liveness, readiness, and startup results together. Internal endpoint for
        orchestrators and monitoring, not a user-facing availability contract.
      operationId: getHealthSnapshot
      tags: [Health]
      responses:
        "200":
          $ref: "#/components/responses/HealthOk"
        "503":
          $ref: "#/components/responses/HealthUnavailable"

  /health/liveness:
    get:
      summary: Process liveness probe
      operationId: getHealthLiveness
      tags: [Health]
      responses:
        "200":
          $ref: "#/components/responses/HealthOk"
        "503":
          $ref: "#/components/responses/HealthUnavailable"

  /health/readiness:
    get:
      summary: Dependency readiness probe
      description: Reports `database` in `dependencies`. Only the public status is exposed.
      operationId: getHealthReadiness
      tags: [Health]
      responses:
        "200":
          $ref: "#/components/responses/HealthOk"
        "503":
          $ref: "#/components/responses/HealthUnavailable"

  /health/startup:
    get:
      summary: Boot completion probe
      operationId: getHealthStartup
      tags: [Health]
      responses:
        "200":
          $ref: "#/components/responses/HealthOk"
        "503":
          $ref: "#/components/responses/HealthUnavailable"

  /api/v0/session:
    get:
      summary: Current browser session summary
      description: >-
        Reports whether the caller's first-party cookie authenticates them, and returns the CSRF
        token required for unsafe requests on this surface. Never returns a credential.
      operationId: getSession
      tags: [Session]
      security:
        - coreBrowserCookie: []
        - {}
      responses:
        "200":
          description: Session summary. `authenticated` is false for an anonymous caller.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummary"
        "403":
          $ref: "#/components/responses/Problem"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "503":
          $ref: "#/components/responses/Problem"

  /api/v0/token/refresh:
    post:
      summary: Rotate the browser credential pair
      description: >-
        Exchanges the opaque refresh cookie for a new access cookie and a rotated refresh cookie.
        Credentials are returned as `Set-Cookie` only, never in the body. Requires `X-CSRF-Token`.
        Rejects requests that present an `Authorization` header: this endpoint serves the cookie
        transport only.
      operationId: refreshToken
      tags: [Session]
      security:
        - coreBrowserCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: >-
            Credentials rotated. The new cookies are on the response. The body is a placeholder for a
            representation that does not exist; RFC 9110 15.3.5 would make this a 204, and it will
            become one once the external edge consumer can be moved off the `refreshed` key.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                type: object
                required: [refreshed]
                properties:
                  refreshed:
                    type: boolean
                    enum: [true]
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Problem"

  /api/v0/profile:
    get:
      summary: Current native client profile
      description: >-
        Bearer-token resource endpoint for native clients. Rejects any request that also carries
        cookies: a single endpoint accepts exactly one credential transport.
      operationId: getProfile
      tags: [Profile]
      security:
        - bearerToken: []
      responses:
        "200":
          description: The authenticated actor.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                type: object
                required: [actor]
                properties:
                  actor:
                    $ref: "#/components/schemas/Actor"
        "401":
          description: >-
            No usable bearer token. `WWW-Authenticate` names the bearer error per RFC 6750 3.1.
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer error="invalid_token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The token lacks the required scope.
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer error="insufficient_scope"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v0/entries:
    get:
      summary: List published entries
      description: >-
        Returns the published entries for this host's content surface and audience. Served from the
        docs, help, news, and info subdomains of each surface.
      operationId: listEntries
      tags: [Content]
      parameters:
        - name: locale
          in: query
          schema:
            type: string
            example: ja
        - name: category
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/IfModifiedSince"
      responses:
        "200":
          description: The published entries.
          headers:
            Cache-Control:
              schema:
                type: string
                example: max-age=60, public
            ETag:
              schema:
                type: string
            Last-Modified:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/Entry"
        "304":
          description: The cached representation is still fresh.
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v0/entries/{slug}:
    get:
      summary: Read one published entry
      operationId: getEntry
      tags: [Content]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: locale
          in: query
          schema:
            type: string
            example: ja
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/IfModifiedSince"
      responses:
        "200":
          description: The published entry.
          headers:
            Cache-Control:
              schema:
                type: string
                example: max-age=60, public
            ETag:
              schema:
                type: string
            Last-Modified:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [entry]
                properties:
                  entry:
                    $ref: "#/components/schemas/Entry"
        "304":
          description: The cached representation is still fresh.
        "404":
          $ref: "#/components/responses/Problem"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "429":
          $ref: "#/components/responses/RateLimited"

components:
  securitySchemes:
    coreBrowserCookie:
      type: apiKey
      in: cookie
      name: __Host-auth_access
      description: >-
        First-party HttpOnly access cookie. The `__Host-` prefix is present in any secure context;
        the basename alone (`auth_access`) is used otherwise. Unsafe methods additionally require
        `X-CSRF-Token`.
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Native client access token. Cookie-bearing requests are rejected.

  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
      description: CSRF token obtained from `GET /api/v0/session`.

    IfNoneMatch:
      name: If-None-Match
      in: header
      description: Prior `ETag`. A match answers `304` with no body (RFC 9110 13.1.2).
      schema:
        type: string

    IfModifiedSince:
      name: If-Modified-Since
      in: header
      description: Prior `Last-Modified`. RFC 9110 13.1.3.
      schema:
        type: string

  responses:
    Problem:
      description: An RFC 9457 problem document.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    NotAcceptable:
      description: >-
        The request `Accept` excludes both `application/json` and `application/problem+json`. The
        refusal is still sent as a problem document (RFC 9110 15.5.7).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    UnsupportedMediaType:
      description: The request carries a body whose `Content-Type` is not `application/json`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    RateLimited:
      description: A rate limit was exceeded.
      headers:
        Retry-After:
          description: >-
            Seconds to wait before retrying. This is the authoritative retry signal; the RateLimit
            header is informational and may be absent.
          schema:
            type: integer
        RateLimit:
          schema:
            type: string
            example: '"default";r=0;t=60'
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    HealthOk:
      description: The probe passed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthResult"

    HealthUnavailable:
      description: The probe failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthResult"

  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details.
      required: [type, title, status, request_id]
      properties:
        type:
          type: string
          format: uri
          description: >-
            Stable problem identifier. Branch on this value, never on title or detail. Clients must
            not dereference it (RFC 9457 3.1.1).
          enum:
            - urn:umaxica:problem:bad-request
            - urn:umaxica:problem:authentication-required
            - urn:umaxica:problem:token-expired
            - urn:umaxica:problem:authorization-denied
            - urn:umaxica:problem:csrf-verification-failed
            - urn:umaxica:problem:not-found
            - urn:umaxica:problem:method-not-allowed
            - urn:umaxica:problem:not-acceptable
            - urn:umaxica:problem:unsupported-media-type
            - urn:umaxica:problem:validation-failed
            - urn:umaxica:problem:rate-limited
            - urn:umaxica:problem:server-error
            - urn:umaxica:problem:service-unavailable
        title:
          type: string
          description: Stable summary of the type. Not for programmatic use.
        status:
          type: integer
          description: Duplicates the HTTP status code and always agrees with it.
        detail:
          type: string
          description: Occurrence-specific explanation for a human. Absent when there is none.
        instance:
          type: string
          description: Path identifying this occurrence.
        request_id:
          type: string
          description: Request correlation identifier. Always present.
        errors:
          type: array
          description: Field-level validation problems. Present only on 422.
          items:
            type: object
            required: [pointer, type]
            properties:
              pointer:
                type: string
                description: RFC 6901 JSON Pointer into the request body.
              type:
                type: string
                format: uri
              detail:
                type: string

    SessionSummary:
      type: object
      required: [authenticated, csrf_token]
      properties:
        authenticated:
          type: boolean
        csrf_token:
          type: string
          description: Required as `X-CSRF-Token` on unsafe requests to this surface.
        actor:
          type: object
          description: Present only when authenticated.
          required: [id, display_name]
          properties:
            id:
              type: string
              description: Public identifier. Never a database primary key.
            display_name:
              type: string

    Actor:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          example: client
        id:
          type: string
          description: Public identifier.

    Entry:
      type: object
      description: One published entry, rendered from its frozen published version.
      required:
        [namespace, surface, slug, locale, title, summary, body, published_at, taxonomy]
      properties:
        namespace:
          type: string
          description: Content surface.
          enum: [docs, help, news, info]
        surface:
          type: string
          description: Audience.
          enum: [app, com, org]
        slug:
          type: string
          nullable: true
        locale:
          type: string
          example: ja
        title:
          type: string
        summary:
          type: string
          nullable: true
        body:
          type: object
          description: >-
            Always a structured object, never a bare string. Consumers may rely on the type.
          additionalProperties: true
        published_at:
          type: string
          format: date-time
          nullable: true
          description: RFC 3339 instant.
        taxonomy:
          type: object
          description: >-
            Keyed by vocabulary key for this audience and surface. A single-valued vocabulary
            renders one object or null; a multi-valued vocabulary renders an ordered array.
          additionalProperties: true

    HealthResult:
      type: object
      description: >-
        The shared probe contract. See docs/reference/health-endpoints.md.
      required: [status, check, dependencies, details]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        check:
          type: string
          enum: [health, liveness, readiness, startup]
        dependencies:
          type: object
          description: >-
            Per-probe dependency map. Empty for liveness and startup; `{ "database": ... }` for
            readiness; the nested probe results for the snapshot.
          additionalProperties: true
        details:
          type: object
          required: [generated_at]
          properties:
            generated_at:
              type: string
              format: date-time
              description: UTC RFC 3339 instant with millisecond precision.
            revision:
              type: string
              description: Deployment revision. Omitted when blank.
            status:
              type: string
              description: Internal status. Present only when the result is degraded.
