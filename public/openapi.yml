openapi: 3.0.3
info:
  title: Rails Application API
  description: API documentation for v0 endpoints across all domains
  version: 1.0.0
  contact:
    name: API Support
servers:
  - url: https://id.app.localhost
    description: Sign Service (User)
  - url: https://id.org.localhost
    description: Sign Staff
  - url: https://core.com.localhost
    description: Core Corporate
  - url: https://core.app.localhost
    description: Core Service
  - url: https://core.org.localhost
    description: Core Staff
  - url: https://www.com.localhost
    description: Acme Corporate
  - url: https://www.app.localhost
    description: Acme Service
  - url: https://www.org.localhost
    description: Acme Staff
  - url: https://www.net.localhost
    description: Acme Network
  - url: https://www.dev.localhost
    description: Acme Developer

paths:
  /v0/health:
    get:
      summary: Health check endpoint
      description: Returns the health status of the API
      operationId: getHealth
      tags:
        - Health
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                  - version
                  - time
                properties:
                  status:
                    type: string
                    enum: [OK, BOOTING, UNHEALTHY, ERROR]
                    description: Health status of the API
                  service:
                    type: string
                    description: Service namespace handling the health check
                  version:
                    type: string
                    nullable: true
                    description: Rails application revision
                  time:
                    type: string
                    format: date-time
                    description: UTC response timestamp
              examples:
                success:
                  value:
                    status: OK
                    service: sign
                    version: 114fe4bd-6ee1-4f37-bf61-8e3ce208684a
                    time: "2026-05-29T00:17:52.131Z"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: _session_id

  schemas:
    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          description: Additional error details

tags:
  - name: Health
    description: Health check endpoints
