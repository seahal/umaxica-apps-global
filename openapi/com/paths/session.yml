# GET /api/v0/session on the com surface.
#
# `servers` is declared here rather than at the document root because only the Core paths have a
# host that is both real and public and knowable from the repository. `jp.umaxica.com` is a literal
# in config/environments/production.rb and is the canonical Core public host per
# adr/core-canonical-public-host.md.
servers:
  - url: https://jp.umaxica.com
    description: Canonical Core public host for the com (public and corporate) surface.
get:
  summary: Current browser session summary
  description: >-
    Reports whether the caller's first-party cookie authenticates them, and returns the CSRF token
    required for unsafe requests on this surface. Never returns a credential.
  operationId: getSession
  tags: [Session]
  security:
    - coreBrowserCookie: []
    - {}
  responses:
    "200":
      description: Session summary. `authenticated` is false for an anonymous caller.
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: "../../shared/components.yml#/schemas/SessionSummary"
    "403":
      $ref: "../../shared/components.yml#/responses/Problem"
    "406":
      $ref: "../../shared/components.yml#/responses/NotAcceptable"
    "503":
      $ref: "../../shared/components.yml#/responses/Problem"
