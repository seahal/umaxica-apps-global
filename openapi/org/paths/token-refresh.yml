# POST /api/v0/token/refresh on the org surface.
servers:
  - url: https://jp.umaxica.org
    description: Canonical Core public host for the org (staff and organization) surface.
post:
  summary: Rotate the browser credential pair
  description: >-
    Exchanges the opaque refresh cookie for a new access cookie and a rotated refresh cookie.
    Credentials are returned as `Set-Cookie` only, never in the body. Requires `X-CSRF-Token`.
    Rejects requests that present an `Authorization` header: this endpoint serves the cookie
    transport only.
  operationId: refreshToken
  tags: [Session]
  security:
    - coreBrowserCookie: []
  parameters:
    - $ref: "../../shared/components.yml#/parameters/CsrfToken"
  responses:
    "204":
      description: >-
        Credentials rotated. The new cookies are on the response; there is no representation to
        return, so there is no body (RFC 9110 15.3.5).
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
    "401":
      $ref: "../../shared/components.yml#/responses/Problem"
    "403":
      $ref: "../../shared/components.yml#/responses/Problem"
    "406":
      $ref: "../../shared/components.yml#/responses/NotAcceptable"
    "415":
      $ref: "../../shared/components.yml#/responses/UnsupportedMediaType"
    "429":
      $ref: "../../shared/components.yml#/responses/RateLimited"
    "503":
      $ref: "../../shared/components.yml#/responses/Problem"
