# GET /api/v0/profile
#
# No `servers`: the Palm host is resolved at boot from the PALM_SERVICE_URL environment
# variable and has no literal in the repository, so no accurate value can be written here.
get:
  summary: Current native client profile
  description: >-
    Bearer-token resource endpoint for native clients on the app surface. Rejects any request that
    also carries cookies: an endpoint accepts exactly one credential transport. The host is
    deployment configuration; see PALM_SERVICE_URL.
  operationId: getProfile
  tags: [Profile]
  security:
    - bearerToken: []
  responses:
    "200":
      description: The authenticated actor.
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            type: object
            required: [actor]
            properties:
              actor:
                $ref: "../components.yml#/schemas/Actor"
    "401":
      description: >-
        No usable bearer token. `WWW-Authenticate` names the bearer error per RFC 6750 3.1.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer error="invalid_token"
      content:
        application/problem+json:
          schema:
            $ref: "../components.yml#/schemas/Problem"
    "403":
      description: The token lacks the required scope.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer error="insufficient_scope"
      content:
        application/problem+json:
          schema:
            $ref: "../components.yml#/schemas/Problem"
    "406":
      $ref: "../components.yml#/responses/NotAcceptable"
    "429":
      $ref: "../components.yml#/responses/RateLimited"
