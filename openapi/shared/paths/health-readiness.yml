# GET /health/readiness
#
# No `servers`: the health endpoints are blocked at the edge and have no public host.
# They are reachable only from inside the deployment network. Naming a host here would
# describe an address no client of this description can use.
get:
  summary: Dependency readiness probe
  description: >-
    Internal probe for orchestrators and monitoring, not a user-facing availability contract.
    Reports `database` in `dependencies`. Only the public status is exposed.
  security: []
  operationId: getHealthReadiness
  tags: [Health]
  responses:
    "200":
      $ref: "../components.yml#/responses/HealthOk"
    "503":
      $ref: "../components.yml#/responses/HealthUnavailable"
